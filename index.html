};
K.profileStats=function(){
  var s=K.save,cleared=Object.keys(s.cleared).filter(function(k){return s.cleared[k]}).length,mastered=0,k;
  for(k in s.codex) if(s.codex[k]&&s.codex[k].streak>=3) mastered++;
  var st=s.stats||{};
  return {stages:Math.min(cleared,WB.CHAPTERS.length*3),stagesMax:WB.CHAPTERS.length*3,chapters:K.chaptersCleared(),chaptersMax:WB.CHAPTERS.length,
    mastered:mastered,fights:st.fights|0,acc:st.answers>0?Math.round(100*(st.right|0)/st.answers):0,answers:st.answers|0,
    weapons:s.owned.weapons.length,weaponsMax:WB.WEAPONS.length,login:K.dailyState().n,loginMax:WB.DAILY.length};
};

/* ---------- Login harian (10 hari) ---------- */
/* Hari yang terlewat tidak mengulang dari awal; satu hadiah per hari kalender. Jam mundur tidak memberi hadiah ganda. */
K.dailyNum=function(){var d=K.nowFn?K.nowFn():new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()};
K.dailyState=function(){
  var l=K.save.login||{last:0,n:0},max=WB.DAILY.length,n=Math.max(0,Math.min(max,l.n|0));
  return {n:n,max:max,done:n>=max,canClaim:n<max&&K.dailyNum()>(l.last|0),next:n+1};
};
K.claimDaily=function(){
  var st=K.dailyState();
  if(st.done) return {ok:false,msg:T('Semua hadiah 10 hari sudah diambil.')};
  if(!st.canClaim) return {ok:false,msg:T('Hadiah hari ini sudah diambil.')};
  var r=WB.DAILY[st.n],s=K.save;
  if(r.gold) s.gold+=r.gold;
  if(r.ink) s.ink+=r.ink;
  if(r.shards) s.shards+=r.shards;
  if(r.potions) s.potions+=r.potions;
  if(r.outfit&&s.owned.outfits.indexOf(r.outfit)<0) s.owned.outfits.push(r.outfit);
  if(r.weapon&&s.owned.weapons.indexOf(r.weapon)<0) s.owned.weapons.push(r.weapon);
  s.login={last:K.dailyNum(),n:st.n+1};
  K.persist();
  return {ok:true,day:r.day,reward:r,msg:T('Hadiah hari ke-{n} diterima!',{n:r.day})};
};

/* ---------- Senjata dan ekonomi ---------- */
K.weapon=function(id){for(var i=0;i<WB.WEAPONS.length;i++) if(WB.WEAPONS[i].id===id) return WB.WEAPONS[i];return null};
K.masteryLevel=function(id){return Math.min(B.MASTERY_MAX,Math.floor(Math.sqrt(K.save.wuses[id]||0)))};
K.upLevel=function(id){return K.save.wup[id]||0};
K.wstats=function(id){
  var w=K.weapon(id),m=K.masteryLevel(id),u=K.upLevel(id);
  return {id:id,w:w,mastery:m,up:u,time:r1(w.time*(1-B.MASTERY_TIME_CUT*m)),mult:r1(w.mult*(1+B.UP_ATK*u)*10)/10};
};
K.ownsWeapon=function(id){return K.save.owned.weapons.indexOf(id)>=0};
function spend(cur,price){
  var key=cur==='shards'?'shards':'gold';
  if(K.save[key]<price) return false;
  K.save[key]-=price;return true;
}
K.buyWeapon=function(id){
  var w=K.weapon(id);if(!w||K.ownsWeapon(id)) return {ok:false,msg:T('Sudah dimiliki.')};
  if(w.exclusive) return {ok:false,msg:T('Hadiah eksklusif, tidak dijual.')};
  if(!spend(w.cur,w.price)) return {ok:false,msg:T(w.cur==='shards'?'Shard belum cukup.':'Gold belum cukup.')};
  K.save.owned.weapons.push(id);K.persist();return {ok:true,msg:w.name+' dibeli.'};
};
K.upgradeCost=function(id){var l=K.upLevel(id);return l>=B.UP_MAX?null:B.UP_COST[l]};
K.upgradeWeapon=function(id){
  if(!K.ownsWeapon(id)) return {ok:false,msg:T('Belum dimiliki.')};
  var c=K.upgradeCost(id);if(c===null) return {ok:false,msg:T('Sudah maksimal.')};
  if(K.save.ink<c) return {ok:false,msg:T('Ink belum cukup.')};
  K.save.ink-=c;K.save.wup[id]=K.upLevel(id)+1;K.persist();return {ok:true,msg:T('Senjata naik ke level {n}.',{n:K.upLevel(id)})};
};
K.setWeapon=function(id){if(K.ownsWeapon(id)){K.save.weapon=id;K.persist();return true}return false};
K.buyPotion=function(){
  if(!spend('gold',B.POTION_PRICE)) return {ok:false,msg:T('Gold belum cukup.')};
  K.save.potions++;K.persist();return {ok:true,msg:T('Ramuan dibeli.')};
};

/* ---------- Kosmetik ---------- */
K.cosmeticList=function(slot){
  if(slot==='hair') return WB.HAIR_STYLES;
  if(slot==='outfit') return WB.OUTFITS;
  return WB.ACC[slot].items;
};
K.owns=function(slot,id){
  var key=slot==='outfit'?'outfits':slot;
  return K.save.owned[key].indexOf(id)>=0;
};
K.buyCosmetic=function(slot,id){
  var list=K.cosmeticList(slot),it=null;
  for(var i=0;i<list.length;i++) if(list[i].id===id) it=list[i];
  if(!it) return {ok:false,msg:T('Item tidak ada.')};
  if(it.exclusive) return {ok:false,msg:T('Hadiah eksklusif, tidak dijual.')};
  if(slot==='outfit'&&!it.price) return {ok:false,msg:T('Didapat dari cerita.')};
  if(K.owns(slot,id)) return {ok:false,msg:T('Sudah dimiliki.')};
  if(!spend(it.cur,it.price)) return {ok:false,msg:T(it.cur==='shards'?'Shard belum cukup.':'Gold belum cukup.')};
  K.save.owned[slot==='outfit'?'outfits':slot].push(id);K.persist();return {ok:true,msg:it.name+' dibeli.'};
};
K.setCfg=function(key,val){
  var slotMap={hairStyle:'hair',outfit:'outfit',hat:'hat',face:'face',neck:'neck',back:'back'};
  if(slotMap[key]&&!K.owns(slotMap[key],val)) return false;
  K.save.cfg[key]=val;K.persist();return true;
};

/* ---------- Kodeks kata ---------- */
K.codexEntry=function(id){return K.save.codex[id]||null};
K.isMastered=function(id){var e=K.save.codex[id];return !!(e&&e.streak>=3)};
K.record=function(id,correct){
  var e=K.save.codex[id]||(K.save.codex[id]={seen:0,right:0,wrong:0,streak:0,day:''});
  var was=e.streak>=3;e.seen++;K.save.stats.answers++;
  if(correct){
    e.right++;K.save.stats.right++;
    var d=K.today();if(e.day!==d){e.streak++;e.day=d}
    K.save.perf.ok++;K.save.perf.bad=0;
    if(K.save.perf.ok>=5){K.save.perf.off=Math.min(1,K.save.perf.off+1);K.save.perf.ok=0}
  }else{
    e.wrong++;e.streak=0;
    K.save.perf.bad++;K.save.perf.ok=0;
    if(K.save.perf.bad>=3){K.save.perf.off=Math.max(-1,K.save.perf.off-1);K.save.perf.bad=0}
  }
  var now=e.streak>=3;
  if(now&&!was){K.save.shards++;return 'mastered'}
  return correct?'right':'wrong';
};
K.codexCounts=function(){
  var c={total:0,mastered:0,learning:0,fresh:0};
  for(var id in K.save.codex){var e=K.save.codex[id];c.total++;if(e.streak>=3) c.mastered++;else if(e.right>0) c.learning++;else c.fresh++}
  return c;
};
K.weakIds=function(){
  var out=[];
  for(var id in K.save.codex){var e=K.save.codex[id];if(e.streak<3) out.push({id:id,wrong:e.wrong,day:e.day})}
  out.sort(function(a,b){return b.wrong-a.wrong||(a.day<b.day?-1:1)});
  return out.map(function(x){return x.id});
};

/* ---------- Pembuat soal ---------- */
var BANK={scramble:WB.SCRAMBLE,synonym:WB.SYNONYM,fill:WB.FILL,order:WB.ORDER,idiom:WB.IDIOM};
var LV={scramble:2,synonym:3,fill:3,order:1,idiom:3};
K.recent=[];
function remember(id){K.recent.push(id);if(K.recent.length>14) K.recent.shift()}

function pickIndex(type,tier,filter){
  var bank=BANK[type];
  for(var pass=0;pass<2;pass++){
    var cands=[],ws=[],sum=0;
    for(var i=0;i<bank.length;i++){
      var row=bank[i],lv=row[LV[type]],d=lv-tier;
      if(pass===0&&Math.abs(d)>1) continue;
      if(filter&&!filter(row)) continue;
      var w=d===0?6:(d<0?2:1);
      if(pass===1) w=1;
      if(K.recent.indexOf(type+':'+i)>=0) w*=0.1;
      cands.push(i);ws.push(w);sum+=w;
    }
    if(cands.length){
      var x=K.rng()*sum;
      for(var j=0;j<cands.length;j++){x-=ws[j];if(x<=0) return cands[j]}
      return cands[cands.length-1];
    }
  }
  return 0;
}
/* id ubin = posisi di larik acak, jadi it.tiles[id] selalu ubin yang dimaksud */
function mkTiles(tokens){
  var out=shuffle(tokens),n=0;
  while(tokens.length>2&&n<12&&out.every(function(t,i){return t===tokens[i]})){out=shuffle(tokens);n++}
  return out.map(function(ch,i){return {id:i,ch:ch}});
}
function mkOpts(ans,wrong){return shuffle([ans].concat(wrong))}

K.buildItem=function(type,i){
  var row=BANK[type][i],id=type+':'+i,it;
  if(type==='scramble'){
    var tokens=row[0].split('');
    it={word:row[0],clue:row[1],level:row[2],answer:tokens,tiles:mkTiles(tokens),slots:tokens.map(function(){return null})};
  }else if(type==='synonym'){
    it={word:row[0],ans:row[1],opts:mkOpts(row[1],row[2]),level:row[3],kind:row[4],off:[]};
  }else if(type==='fill'){
    it={sentence:row[0],ans:row[1],opts:mkOpts(row[1],row[2]),level:row[3],cat:row[4],off:[]};
  }else if(type==='idiom'){
    it={idiom:row[0],ans:row[1],opts:mkOpts(row[1],row[2]),level:row[3],off:[]};
  }else{ /* order */
    var words=row[0].split(' '),rest=words.slice(1);
    it={sentence:row[0],first:words[0],level:row[1],answer:rest,tiles:mkTiles(rest),slots:rest.map(function(){return null})};
  }
  it.id=id;it.type=type;it.done=false;it.miss=0;it.hinted=false;
  return it;
};

var POOL=null;
function pool(){
  if(POOL) return POOL;
  POOL={};
  WB.VOCAB.forEach(function(v){var l=v[0][0];(POOL[l]=POOL[l]||[]).push(v)});
  return POOL;
}
K.buildChain=function(tier,promptWord){
  var P=pool(),prompt=null;
  var cands=WB.VOCAB.filter(function(v){
    if(promptWord) return v[0]===promptWord;
    var last=v[0][v[0].length-1];
    return Math.abs(v[1]-tier)<=1&&P[last]&&P[last].some(function(x){return x[0]!==v[0]});
  });
  if(!cands.length) cands=WB.VOCAB.filter(function(v){var last=v[0][v[0].length-1];return P[last]&&P[last].some(function(x){return x[0]!==v[0]})});
  var fresh=cands.filter(function(v){return K.recent.indexOf('chain:'+v[0])<0});
  prompt=pick(fresh.length?fresh:cands)[0];
  var letter=prompt[prompt.length-1];
  var ansPool=P[letter].filter(function(x){return x[0]!==prompt&&x[1]<=tier+1});
  if(!ansPool.length) ansPool=P[letter].filter(function(x){return x[0]!==prompt});
  var ans=pick(ansPool)[0];
  var letters=Object.keys(P).filter(function(l){return l!==letter});
  var wrong=[];
  shuffle(letters).forEach(function(l){if(wrong.length<3){var w=pick(P[l])[0];wrong.push(w)}});
  return {id:'chain:'+prompt,type:'chain',prompt:prompt,letter:letter,ans:ans,opts:mkOpts(ans,wrong),level:tier,off:[],done:false,miss:0,hinted:false};
};
K.makeItem=function(type,tier,filter){
  var it;
  if(type==='chain') it=K.buildChain(tier);
  else it=K.buildItem(type,pickIndex(type,tier,filter));
  remember(it.id);return it;
};
K.makeItemById=function(id,tier){
  var p=id.split(':'),type=p[0];
  if(type==='chain') return K.buildChain(tier||2,p.slice(1).join(':'));
  var i=parseInt(p[1],10);
  if(!BANK[type]||!BANK[type][i]) return null;
  return K.buildItem(type,i);
};
K.describe=function(id){
  var p=id.split(':'),type=p[0],i=parseInt(p[1],10),row;
  if(type==='chain') return {type:type,text:T('{x} → kata berawalan huruf terakhir',{x:p.slice(1).join(':')}),lv:0};
  row=BANK[type]&&BANK[type][i];if(!row) return {type:type,text:id,lv:0};
  if(type==='scramble') return {type:type,text:row[0]+' ('+T(row[1])+')',lv:row[2]};
  if(type==='synonym') return {type:type,text:row[0]+(row[4]==='a'?' ↔ ':' = ')+row[1],lv:row[3]};
  if(type==='fill') return {type:type,text:row[0].replace('___',row[1]),lv:row[3]};
  if(type==='idiom') return {type:type,text:row[0]+' = '+row[1],lv:row[3]};
  return {type:type,text:row[0],lv:row[1]};
};

/* ---------- Interaksi soal ---------- */
var CHOICE={synonym:1,fill:1,idiom:1,chain:1};
K.isChoice=function(it){return !!CHOICE[it.type]};
function usedIds(it){return it.slots.filter(function(x){return x!==null})}
function tileText(it,id){return it.tiles[id].ch}
function joinTokens(it,arr){return arr.join(it.type==='order'?' ':'')}
function checkFull(it){
  var got=it.slots.map(function(id){return tileText(it,id)});
  if(joinTokens(it,got)===joinTokens(it,it.answer)) return 'ok';
  it.slots=it.slots.map(function(){return null});
  return 'wrong';
}
K.itemTile=function(it,id){
  if(it.done||(it.type!=='scramble'&&it.type!=='order')) return null;
  if(usedIds(it).indexOf(id)>=0) return null;
  var idx=it.slots.indexOf(null);if(idx<0) return null;
  it.slots[idx]=id;
  return it.slots.indexOf(null)<0?checkFull(it):'placed';
};
K.itemSlot=function(it,idx){
  if(it.done||(it.type!=='scramble'&&it.type!=='order')||it.slots[idx]===undefined||it.slots[idx]===null) return null;
  it.slots[idx]=null;return 'removed';
};
K.itemOpt=function(it,idx){
  if(it.done||!CHOICE[it.type]||it.off.indexOf(idx)>=0||idx<0||idx>=it.opts.length) return null;
  if(it.opts[idx]===it.ans) return 'ok';
  it.off.push(idx);return 'wrong';
};
K.itemHint=function(it){
  if(it.done) return false;
  if(CHOICE[it.type]){
    var wrong=[];it.opts.forEach(function(o,i){if(o!==it.ans&&it.off.indexOf(i)<0) wrong.push(i)});
    if(wrong.length<=1) return false;
    it.off.push(pick(wrong));it.hinted=true;return true;
  }
  var i=-1,k;
  for(k=0;k<it.answer.length;k++){var id=it.slots[k];if(id===null||it.tiles[id].ch!==it.answer[k]){i=k;break}}
  if(i<0) return false;
  var locked=it.slots.slice(0,i),tile=null;
  for(k=0;k<it.tiles.length;k++){var t=it.tiles[k];if(t.ch===it.answer[i]&&locked.indexOf(t.id)<0){tile=t;break}}
  if(!tile) return false;
  var j=it.slots.indexOf(tile.id);if(j>=0) it.slots[j]=null;
  it.slots[i]=tile.id;it.hinted=true;
  return true;
};
K.itemFull=function(it){return it.slots&&it.slots.indexOf(null)<0};

/* Puzzle: urutan beberapa soal. Kemajuan waktu lewat update(dt), tanpa setTimeout. */
function Puzzle(items,cb){
  this.items=items;this.i=0;this.mistakes=0;this.hints=0;this.lock=false;this.lockT=0;this.t=0;this.done=false;this.cb=cb||{};
}
Puzzle.LOCK=0.48;
Puzzle.prototype.cur=function(){return this.items[this.i]};
Puzzle.prototype._solved=function(){
  var it=this.cur();it.done=true;this.lock=true;this.lockT=Puzzle.LOCK;
  if(this.cb.solved) this.cb.solved(it);
};
Puzzle.prototype._wrong=function(it){
  this.mistakes++;it.miss++;
  if(this.cb.mistake) this.cb.mistake(it,it.miss===1);
};
Puzzle.prototype._after=function(res){
  if(res==='ok') this._solved();
  else if(res==='wrong'){this._wrong(this.cur())}
  return res;
};
Puzzle.prototype.tile=function(id){if(this.lock||this.done) return null;return this._after(K.itemTile(this.cur(),id))};
Puzzle.prototype.slot=function(idx){if(this.lock||this.done) return null;return K.itemSlot(this.cur(),idx)};
Puzzle.prototype.opt=function(idx){if(this.lock||this.done) return null;return this._after(K.itemOpt(this.cur(),idx))};
Puzzle.prototype.hint=function(){
  if(this.lock||this.done) return false;
  var it=this.cur();
  if(!K.itemHint(it)) return false;
  this.hints++;
  if(!CHOICE[it.type]&&K.itemFull(it)){this._after(checkFull(it)==='ok'?'ok':'wrong')}
  return true;
};
Puzzle.prototype.update=function(dt){
  if(this.done) return;
  this.t+=dt;
  if(this.lock){
    this.lockT-=dt;
    if(this.lockT<=0){
      this.lock=false;this.i++;this.t=0;
      if(this.i>=this.items.length){this.done=true;if(this.cb.done) this.cb.done()}
      else if(this.cb.next) this.cb.next();
    }
  }
};
K.Puzzle=Puzzle;

/* ---------- Pertarungan ---------- */
var PHASE_CATS=[['pas'],['pre','fut'],['per']];
var PHASE_TXT=['Past tense','Present and future','Perfect tense'];

function Battle(o){
  this.ch=o.ch;this.stage=o.stage;this.challenge=!!o.challenge;this.chapter=WB.CHAPTERS[o.ch];
  this.fights=K.stageFights(o.ch,o.stage);this.fi=0;
  this.maxHp=K.playerMaxHp();this.hp=this.maxHp;this.combo=1;
  this.attack=null;this.shield=false;this.over=false;this.state='fight';this.result=null;
  this.stats={gold:0,ink:0,shards:0,perfect:0,attacks:0,mastered:0};
  this.missedAll={};this.hitline=T('Rumus damage: ATK × senjata × kecepatan × akurasi × combo');
  this.on=o.on||function(){};
  this.startFight();
}
Battle.prototype.emit=function(t,d){this.on(t,d||{})};
Battle.prototype.startFight=function(){
  this.mid=this.fights[this.fi];this.def=WB.MONSTERS[this.mid];
  this.maxMhp=Math.round(this.def.hp*this.chapter.scale*(this.challenge?1.2:1));
  this.mhp=this.maxMhp;this.gauge=0;this.fightMissed=[];this.attack=null;this.shield=false;this.state='fight';
  this.emit('fight');
};
Battle.prototype.interval=function(){return this.def.interval};
Battle.prototype.phase=function(){var r=this.mhp/this.maxMhp;return r>0.66?0:(r>0.33?1:2)};
Battle.prototype.tierFor=function(w){
  var t=this.chapter.tier+(w?w.tierAdd:0)+K.save.perf.off+(this.challenge?1:0);
  return clamp(t,1,4);
};
Battle.prototype.weakApplies=function(w,items){
  if(this.def.weak==='mixed') return w.type==='mixed';
  return items.every(function(it){return it.type===this.def.weak},this);
};
Battle.prototype.buildItems=function(w){
  var items=[],tier=this.tierFor(w),def=this.def;
  var n=w.puzzles,offset=rnd(WB.MIXED_ORDER.length);
  for(var i=0;i<n;i++){
    var type=w.type;
    if(def.force==='mixed') type=pick(WB.MIXED_ORDER);
    else if(def.force) type=def.force;
    else if(w.type==='mixed') type=WB.MIXED_ORDER[(offset+i)%WB.MIXED_ORDER.length];
    var it=null,note='';
    if(i===0&&def.mech==='echo'&&this.fightMissed.length){
      it=K.makeItemById(pick(this.fightMissed),tier);if(it) note=T('Gema: soal yang tadi salah');
    }
    if(!it&&i===0&&def.boss&&this.mhp/this.maxMhp<=0.25){
      var weak=K.weakIds();if(weak.length){it=K.makeItemById(weak[0],tier);if(it) note=T('Kata terlupakan')}
    }
    if(!it){
      if(def.mech==='wraith'){
        var cats=PHASE_CATS[this.phase()];
        it=K.makeItem('fill',tier,function(row){return cats.indexOf(row[4])>=0});
        note=T('Fase {n}: {s}',{n:this.phase()+1,s:PHASE_TXT[this.phase()]});
      }else it=K.makeItem(type,tier);
    }
    if(def.mech==='titan'&&it.type==='scramble'){
      var t=it.tiles[rnd(it.tiles.length)];t.hidden=true;note=T('Huruf yang luntur tampil sebagai ?');
    }
    it.note=note;
    items.push(it);
  }
  return items;
};
Battle.prototype.startAttack=function(weaponId){
  if(this.attack||this.over||this.state!=='fight') return false;
  if(!K.ownsWeapon(weaponId)) return false;
  var ws=K.wstats(weaponId),w=ws.w,self=this;
  var items=this.buildItems(w);
  var att={kind:'attack',weaponId:weaponId,ws:ws,time:ws.time*(this.def.mech==='warden'?0.9:1),t:0,items:items};
  att.pz=new Puzzle(items,{
    solved:function(it){self.onSolved(it)},
    mistake:function(it,first){self.onMistake(it,first)},
    done:function(){self.finishAttack()},
    next:function(){self.emit('change')}
  });
  this.attack=att;this.emit('change');return true;
};
Battle.prototype.startGuard=function(){
  if(this.attack||this.over||this.state!=='fight') return false;
  var self=this,tier=clamp(this.chapter.tier-1+K.save.perf.off,1,4);
  var items=[K.makeItem(pick(['scramble','fill','synonym']),tier)];
  items[0].note=T('Guard: jawab cepat untuk menahan serangan berikutnya');
  var att={kind:'guard',weaponId:null,ws:null,time:B.GUARD_TIME,t:0,items:items};
  att.pz=new Puzzle(items,{
    solved:function(it){self.onSolved(it)},
    mistake:function(it,first){self.onMistake(it,first)},
    done:function(){self.finishGuard(true)},
    next:function(){self.emit('change')}
  });
  this.attack=att;this.emit('change');return true;
};
Battle.prototype.onMistake=function(it,first){
  if(first){
    K.record(it.id,false);
    this.fightMissed.push(it.id);this.missedAll[it.id]=1;
    if(this.def.mech==='hydra'||this.def.mech==='void'){var hh=Math.round(this.maxMhp*(this.def.mech==='hydra'?0.04:0.03));this.mhp=Math.min(this.maxMhp,this.mhp+hh)}
  }
  this.emit('wrong',{item:it});
};
Battle.prototype.onSolved=function(it){
  if(it.miss===0){
    var r=K.record(it.id,true);
    if(r==='mastered'){this.stats.mastered++;this.stats.shards++;this.emit('mastered',{item:it})}
  }
  this.emit('solved',{item:it});this.emit('change');
};
Battle.prototype.cancel=function(){
  if(!this.attack) return;
  this.attack=null;this.combo=1;this.hitline=T('Serangan dibatalkan. Combo kembali ke ×1.0.');
  this.emit('change');
};
Battle.prototype.finishAttack=function(){
  var a=this.attack,ws=a.ws,w=ws.w,pz=a.pz;
  var r=a.t/a.time;
  var speed=r<=0.5?1.5-r:1.0-(r-0.5)*0.4;
  var acc=Math.max(B.ACC_MIN,1-B.HINT_COST*(pz.mistakes+pz.hints));
  var weak=this.weakApplies(w,a.items)?B.WEAK:1;
  var combo=this.combo;
  var dmg=Math.round(B.ATK*ws.mult*speed*acc*combo*weak);
  var perfect=pz.mistakes===0&&pz.hints===0;
  this.combo=perfect?Math.min(B.COMBO_MAX,Math.round((this.combo+B.COMBO_STEP)*10)/10):1;
  if(perfect){var inkGain=combo>=1.3?2:1;K.save.ink+=inkGain;this.stats.ink+=inkGain;this.stats.perfect++}
  K.save.wuses[w.id]=(K.save.wuses[w.id]||0)+1;this.stats.attacks++;
  var line=T('ATK {a} × senjata {b} × kecepatan {c} × akurasi {d} × combo {e}{f} = {g}',{a:B.ATK,b:ws.mult.toFixed(1),c:speed.toFixed(2),d:acc.toFixed(2),e:combo.toFixed(1),f:(weak>1?T(' × lemah {n}',{n:B.WEAK.toFixed(1)}):''),g:dmg});
  this.attack=null;
  this.strike(dmg,line,{perfect:perfect,speed:speed,acc:acc});
};
Battle.prototype.timeout=function(){
  var a=this.attack;
  if(a.kind==='guard'){this.attack=null;this.finishGuard(false);return}
  var dmg=Math.round(B.ATK*a.ws.mult*B.TIMEOUT_DMG);
  K.save.wuses[a.weaponId]=(K.save.wuses[a.weaponId]||0)+1;this.stats.attacks++;
  this.combo=1;this.attack=null;
  this.strike(dmg,T('Waktu habis. Serangan keluar dengan {p}% damage: {f}',{p:Math.round(B.TIMEOUT_DMG*100),f:B.ATK+' × '+a.ws.mult.toFixed(1)+' × '+B.TIMEOUT_DMG+' = '+dmg}),{timeout:true});
};
Battle.prototype.finishGuard=function(ok){
  this.attack=null;
  if(ok){this.shield=true;this.hitline=T('Guard aktif: serangan monster berikutnya berkurang {p}%.',{p:Math.round(B.GUARD_REDUCE*100)})}
  else this.hitline=T('Guard gagal. Waktu habis.');
  this.emit('guard',{ok:ok});this.emit('change');
};
Battle.prototype.strike=function(dmg,line,info){
  this.hitline=line;
  this.mhp=Math.max(0,this.mhp-dmg);
  this.emit('strike',{dmg:dmg,info:info||{}});this.emit('change');
  if(this.mhp<=0) this.winFight();
};
Battle.prototype.monsterHit=function(){
  var d=Math.round(this.def.dmg*(1+B.CH_DMG_SCALE*Math.min(this.ch,4)+B.CH_DMG_SCALE_LATE*Math.max(0,this.ch-4))),blocked=false;
  if(this.shield){d=Math.round(d*(1-B.GUARD_REDUCE));this.shield=false;blocked=true}
  this.hp=Math.max(0,this.hp-d);
  this.emit('mhit',{dmg:d,blocked:blocked});
  if(this.hp<=0) this.loseFight();
};
Battle.prototype.usePotion=function(){
  if(this.over||this.state!=='fight'||K.save.potions<=0||this.hp>=this.maxHp) return false;
  K.save.potions--;this.hp=Math.min(this.maxHp,this.hp+B.POTION_HEAL);K.persist();
  this.emit('potion',{});this.emit('change');return true;
};
Battle.prototype.tick=function(dt){
  if(this.over||this.state!=='fight') return;
  this.gauge+=dt;
  if(this.gauge>=this.def.interval){this.gauge=0;this.monsterHit();if(this.over||this.state!=='fight') return}
  var a=this.attack;
  if(a){
    a.t+=dt;a.pz.update(dt);
    var finalLock=a.pz.lock&&a.pz.i===a.items.length-1;
    if(this.attack===a&&a.t>=a.time&&!a.pz.done&&!finalLock) this.timeout();
  }
};
Battle.prototype.fightGold=function(){return Math.round(B.FIGHT_GOLD*(1+0.4*this.ch)*(this.challenge?1.5:1))};
Battle.prototype.winFight=function(){
  this.state='won';this.attack=null;
  var g=this.fightGold();
  var replay=K.isCleared(this.ch,this.stage);
  if(replay) g=Math.round(g*B.REPLAY_GOLD);
  this.stats.gold+=g;K.save.gold+=g;K.save.stats.fights++;
  if(this.fi<this.fights.length-1){this.emit('fightwon',{more:true,gold:g});K.persist();return}
  this.finishStage();
};
Battle.prototype.finishStage=function(){
  var ch=this.chapter,key=K.stageKey(this.ch,this.stage),first=!K.save.cleared[key];
  var res={first:first,boss:this.stage===3,unlockedOutfit:null,ending:false,chapterDone:false};
  var bonus=Math.round(B.STAGE_GOLD*(1+0.4*this.ch)*(this.challenge?1.5:1));
  if(!first) bonus=Math.round(bonus*B.REPLAY_GOLD);
  K.save.gold+=bonus;this.stats.gold+=bonus;
  if(first){
    K.save.cleared[key]=true;
    if(this.stage===3){
      K.save.gold+=ch.gold;K.save.shards+=ch.shards;this.stats.gold+=ch.gold;this.stats.shards+=ch.shards;
      res.chapterDone=true;
      if(K.save.owned.outfits.indexOf(ch.outfit)<0){K.save.owned.outfits.push(ch.outfit);res.unlockedOutfit=ch.outfit}
      if(this.ch===WB.CHAPTERS.length-1&&!K.save.ending) res.ending=true;
    }
  }
  this.state='cleared';this.over=true;this.result=res;K.persist();
  this.emit('cleared',res);
};
/* Iklan reward: pulihkan HP saat kalah (sekali per pertarungan) */
Battle.prototype.canRevive=function(){return this.state==='lost'&&!this.revived};
Battle.prototype.revive=function(){
  if(!this.canRevive()) return false;
  this.revived=true;this.state='fight';this.over=false;this.attack=null;this.shield=false;
  this.hp=Math.min(this.maxHp,B.AD_REVIVE_HP);this.gauge=0;this.combo=1;
  this.hitline=T('HP pulih {n}. Lanjutkan bertarung!',{n:B.AD_REVIVE_HP});
  this.emit('revive');return true;
};
Battle.prototype.loseFight=function(){
  this.state='lost';this.over=true;this.attack=null;this.combo=1;K.persist();this.emit('lose');
};
Battle.prototype.nextFight=function(){
  if(this.state!=='won'||this.fi>=this.fights.length-1) return false;
  this.fi++;this.hp=Math.min(this.maxHp,this.hp+B.HEAL_BETWEEN);this.startFight();return true;
};
Battle.prototype.missedList=function(){return Object.keys(this.missedAll).slice(0,5).map(function(id){return K.describe(id).text})};
K.Battle=Battle;

/* ---------- Memory Rift (ulang kata) ---------- */
K.riftItems=function(){
  var items=[],ids=K.weakIds(),tier=clamp(K.chaptersCleared()+1,1,4);
  for(var i=0;i<ids.length&&items.length<5;i++){var it=K.makeItemById(ids[i],tier);if(it){it.note=T('Kata yang masih lemah');items.push(it)}}
  var types=['scramble','synonym','fill','order','idiom','chain'];
  while(items.length<5){var t=types[items.length%types.length];var it2=K.makeItem(t,tier);it2.note=T('Kata baru');items.push(it2)}
  return items;
};
function Rift(o){
  var self=this;this.on=o&&o.on||function(){};this.items=K.riftItems();this.correct=0;this.state='run';this.result=null;this.mastered=0;
  this.pz=new Puzzle(this.items,{
    solved:function(it){
      if(it.miss===0){self.correct++;var r=K.record(it.id,true);if(r==='mastered'){self.mastered++;self.on('mastered',{item:it})}}
      self.on('solved',{item:it});self.on('change');
    },
    mistake:function(it,first){if(first) K.record(it.id,false);self.on('wrong',{item:it})},
    done:function(){self.finish()},
    next:function(){self.on('change')}
  });
}
Rift.prototype.finish=function(){
  var today=K.today(),first=K.save.lastRift!==today;
  var gold=first?20+this.correct*6:0,ink=first?this.correct:0;
  K.save.gold+=gold;K.save.ink+=ink;
  if(first) K.save.lastRift=today;
  this.state='done';this.result={gold:gold,ink:ink,correct:this.correct,total:this.items.length,first:first,mastered:this.mastered,hints:this.pz.hints,mistakes:this.pz.mistakes};
  K.persist();this.on('done',this.result);
};
Rift.prototype.tick=function(dt){if(this.state==='run') this.pz.update(dt)};
K.Rift=Rift;

/* ---------- Ending ---------- */
K.setEnding=function(id){K.save.ending=id;K.persist()};
K.setSetting=function(k,v){K.save.settings[k]=v;K.persist()};

})(typeof window!=='undefined'?window:globalThis);

</script>
<script>
/* Wordbound: pembuat HTML tiap layar (string murni, tanpa DOM). */
(function(root){
'use strict';
var WB=root.WB=root.WB||{}, K=WB.core, A=WB.art, B=WB.BAL, V=WB.views={};
function T(k,v){return WB.i18n.t(k,v)}
V.T=T;

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
V.esc=esc;
function ch(n){return WB.CHAPTERS[n]}
function btn(act,label,cls,attrs){return '<button type="button" class="btn'+(cls?' '+cls:'')+'" data-act="'+act+'"'+(attrs?' '+attrs:'')+'>'+label+'</button>'}
function cur(kind,n,label){return '<span class="cur"><i class="ic ic-'+kind+'" aria-hidden="true"></i><b>'+n+'</b><span class="sr">'+label+'</span></span>'}
V.currencies=function(){var s=K.save;return cur('gold',s.gold,'Gold')+cur('ink',s.ink,'Ink')+cur('shard',s.shards,'Shard')};
var MECH={
  titan:'Tinta luntur: satu huruf pada soal Susun huruf tampil sebagai ?. Tebak dari konteks.',
  wraith:'Semua soal berupa Isi kalimat. Tense berganti di setiap fase.',
  echo:'Ratu mengulang soal yang tadi kamu jawab salah.',
  ogre:'Semua soal berupa Arti idiom.',
  mute:'Teks soal memudar setelah 4 detik. Ingat baik-baik petunjuknya.',
  hydra:'Semua soal berupa Susun kalimat. Jawaban salah pertama menumbuhkan kepala baru: monster memulihkan 4% HP.',
  warden:'Semua soal berupa Sinonim dan antonim. Waktu serangan dipotong 10%.',
  void:'Teks soal memudar setelah 4 detik, dan jawaban salah pertama memulihkan 3% HP monster.'
};
V.MECH=MECH;
function weakFor(def,w){
  if(def.weak==='mixed') return w.type==='mixed';
  if(def.force) return def.force===def.weak;
  return w.type===def.weak;
}
V.weakFor=weakFor;
function typeLabel(def,w){return T(WB.TYPE_SHORT[def.force||w.type])}

/* ---------- Beranda ---------- */
V.hub=function(){
  var s=K.save,nx=K.nextStage(),c=K.chaptersCleared();
  var started=Object.keys(s.cleared).length>0||s.seen.intro0;
  var main;
  if(nx){
    main=btn('continue',T(started?'Lanjutkan: Babak {n}, {s}':'Mulai petualangan: Babak {n}, {s}',{n:nx.ch+1,s:K.stageName(nx.ch,nx.stage)}),'primary big');
  }else{
    main=btn('go',T('Buka peta dan main lagi (mode Tantangan)'),'primary big','data-to="map"');
  }
  var riftDone=s.lastRift===K.today(),dstate=K.dailyState();
  return '<div class="hub">'+
    '<div class="hero"><div class="herofig">'+A.playerSvg(s.cfg,s.weapon,150)+'</div>'+
    '<div class="herotxt"><h2><span class="pav '+K.avatar().charAt(0)+'" style="width:30px;height:30px">'+A.avatar(K.avatar(),s.cfg,28)+'</span> '+esc(K.profileName())+'</h2><p>'+(c>=WB.CHAPTERS.length?T('Semua babak tamat.'):T('Babak {n} dari {t}',{n:Math.min(c+1,WB.CHAPTERS.length),t:WB.CHAPTERS.length}))+'</p>'+
    '<p class="soft">'+T('Senjata: {n}',{n:esc(K.weapon(s.weapon).name)})+'</p></div></div>'+
    main+
    '<div class="navgrid">'+
      btn('go',T('Peta'),'nav','data-to="map"')+
      btn('go',T('Karakter'),'nav','data-to="creator"')+
      btn('go',T('Toko Pip'),'nav','data-to="shop"')+
      btn('go',T('Kodeks Kata'),'nav','data-to="codex"')+
      btn('go','Memory Rift'+(riftDone?'':' <span class="dot-new">'+T('hari ini')+'</span>'),'nav','data-to="rift"')+
      btn('go',T('Profil'),'nav','data-to="profile"')+
      btn('go',T('Pengaturan'),'nav','data-to="settings"')+
      btn('daily',T('Hadiah Harian')+(dstate.canClaim?' <span class="dot-new">'+T('baru')+'</span>':(dstate.done?' ✓':'')),'nav')+
    '</div></div>';
};

/* ---------- Peta ---------- */
V.map=function(){
  var out='<div class="maplist">';
  WB.CHAPTERS.forEach(function(c,i){
    var unlocked=K.chapterUnlocked(i),done=K.isCleared(i,3);
    var st='';
    for(var s=1;s<=3;s++){
      var ok=K.stageUnlocked(i,s),cl=K.isCleared(i,s);
      var label=s===3?T('Boss'):T('Tahap {n}',{n:s});
      st+='<button type="button" class="stagebtn'+(cl?' cleared':'')+(ok?'':' locked')+'" data-act="stage" data-ch="'+i+'" data-st="'+s+'"'+(ok?'':' disabled')+'>'+
        '<span>'+label+'</span><small>'+(cl?T('Selesai'):(ok?T('Main'):T('Terkunci')))+'</small></button>';
    }
    out+='<article class="chap'+(unlocked?'':' locked')+'"><div class="thumb"><svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMax slice" aria-hidden="true">'+A.scene(c.bg)+'</svg></div>'+
      '<div class="cbody"><div class="chead"><h3>'+T('Babak {n}: {name}',{n:c.id,name:esc(c.name)})+'</h3><span class="badge">'+c.cefr+'</span></div>'+
      '<p class="soft">'+(done?T('Tamat.'):(unlocked?T('Level soal sekitar {n}.',{n:c.cefr}):T('Tamatkan babak sebelumnya untuk membuka.')))+'</p>'+
      '<div class="stages">'+st+'</div></div></article>';
  });
  return out+'</div>';
};

V.stage=function(chI,st,challenge){
  var c=ch(chI),fights=K.stageFights(chI,st),cleared=K.isCleared(chI,st);
  var list=fights.map(function(id){
    var d=WB.MONSTERS[id],hp=Math.round(d.hp*c.scale*(challenge?1.2:1));
    return '<li class="enemy"><div class="efig">'+A.monsterSvg(d,84)+'</div><div><b>'+esc(d.name)+'</b>'+(d.boss?' <span class="badge boss">'+T('Boss')+'</span>':'')+
      '<div class="soft">'+T('HP {n} · Lemah: {t}',{n:hp,t:(d.weak==='mixed'?T('senjata Campuran'):T(WB.TYPE_SHORT[d.weak]))})+'</div>'+
      (d.mech?'<div class="soft">'+esc(T(MECH[d.mech]))+'</div>':'')+'</div></li>';
  }).join('');
  var tier=Math.min(4,c.tier+(challenge?1:0));
  var cef=['A1','A2','B1','B2'][tier-1];
  return '<div class="stageview"><h2>'+T('Babak {n}: {name}',{n:c.id,name:esc(c.name)})+'</h2><p class="soft">'+T('{s} · soal sekitar {c}',{s:K.stageName(chI,st),c:cef})+(challenge?T(' (Tantangan)'):'')+'</p>'+
    '<ul class="enemies">'+list+'</ul>'+
    (cleared?'<div class="toggle"><button type="button" class="btn'+(challenge?' primary':'')+'" data-act="challenge" aria-pressed="'+(challenge?'true':'false')+'">'+T(challenge?'Mode Tantangan: aktif':'Mode Tantangan: mati')+'</button><p class="soft">'+T('Soal satu tingkat lebih sulit, HP monster +20%, gold +50%.')+'</p></div>':'')+
    '<div class="acts col">'+btn('fight',T('Mulai bertarung'),'primary big','data-ch="'+chI+'" data-st="'+st+'"')+btn('go',T('Kembali ke peta'),'','data-to="map"')+'</div></div>';
};

/* ---------- Cerita ---------- */
V.story=function(title,lines,idx,bg){
  var l=lines[idx],col=WB.SPEAKER_COLOR[l[0]]||'#9B8FD1',last=idx>=lines.length-1;
  return '<div class="storyview"><div class="storyarena"><svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMax slice" aria-hidden="true">'+A.scene(bg)+
    '<g transform="translate(95 212)" filter="url(#rough)">'+A.player(K.save.cfg,K.save.weapon)+'</g></svg></div>'+
    '<div class="dialog" role="group" aria-label="'+T('Dialog')+'"><div class="speaker" style="background:'+col+'">'+esc(T(l[0]))+'</div><p>'+esc(T(l[1]))+'</p>'+
    '<div class="acts"><button type="button" class="btn" data-act="skipstory">'+T('Lewati')+'</button>'+
    '<button type="button" class="btn primary" data-act="nextstory">'+T(last?'Lanjut':'Berikutnya')+'</button></div>'+
    '<div class="soft right">'+(idx+1)+' / '+lines.length+'</div></div></div>';
};

/* ---------- Pertarungan ---------- */
V.battle=function(b){
  var wid=K.save.weapon;
  return '<section class="arena" id="arena" aria-label="'+T('Arena pertarungan')+'">'+
    '<svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMax slice" aria-hidden="true">'+A.scene(b.chapter.bg)+
    '<g transform="translate(95 212)"><g id="pAnim" class="fx"><g class="bob" id="pArt" filter="url(#rough)">'+A.player(K.save.cfg,wid)+'</g></g></g>'+
    '<g transform="translate(312 212)"><g id="mAnim" class="fx"><g class="bob2" id="mArt" filter="url(#rough)">'+A.monster(b.def)+'</g></g></g><g id="fx" pointer-events="none"></g></svg>'+
    '<div class="hud hud-l"><div class="hrow"><span>Wordbearer</span><span id="pHpTxt"></span></div><div class="bar hp"><i id="pHp"></i></div><span class="weak" id="pShield"></span></div>'+
    '<div class="hud hud-r"><div class="hrow"><span id="mName"></span><span id="mHpTxt"></span></div><div class="bar mhp"><i id="mHp"></i></div><div class="bar gauge" title="'+T('Gauge serangan monster')+'"><i id="mGauge"></i></div><span class="weak" id="mWeak"></span></div>'+
    '<div class="floats" id="floats"></div></section>'+
    '<div class="battlebar"><p class="hitline" id="hitline" aria-live="polite"></p><span class="chip" id="comboChip">'+T('Combo ×{n}',{n:'1.0'})+'</span></div>'+
    '<div class="weapons" id="weapons"></div><section class="panel" id="panel"></section>';
};
V.hudMonster=function(b){return {name:b.def.name,weak:T('Lemah terhadap: {t}',{t:(b.def.weak==='mixed'?T('senjata Campuran'):T(WB.TYPE_SHORT[b.def.weak]))})+(b.def.boss?T(' · Boss'):'')+' · '+(b.fi+1)+'/'+b.fights.length}};

V.battleWeapons=function(b){
  var busy=!!b.attack||b.over||b.state!=='fight';
  return WB.WEAPONS.filter(function(w){return K.ownsWeapon(w.id)}).map(function(w){
    var ws=K.wstats(w.id),weak=weakFor(b.def,w),selected=K.save.weapon===w.id;
    return '<button type="button" class="weapon'+(selected?' selected':'')+'" data-act="attack" data-w="'+w.id+'"'+(busy?' disabled':'')+'>'+
      '<span class="rar r-'+w.rarity+'">'+WB.RARITY[w.rarity]+'</span>'+
      '<span class="wname">'+esc(w.short)+'</span>'+
      '<span class="wmeta">'+T('{n} soal · {t} dtk',{n:w.puzzles,t:ws.time.toFixed(1).replace('.0','')})+'</span>'+
      '<span class="wmeta">'+T('Damage ×{n}',{n:ws.mult.toFixed(1)})+'</span>'+
      '<span class="wtype'+(weak?' weak':'')+'">'+esc(typeLabel(b.def,w))+(weak?T(' · lemah ×{n}',{n:B.WEAK.toFixed(1)}):'')+'</span></button>';
  }).join('');
};
V.battleIdle=function(b){
  var d=b.def,s=K.save;
  var mech=d.mech?'<p class="mech"><b>'+esc(d.name)+':</b> '+esc(T(MECH[d.mech]))+'</p>':'';
  var ph=d.mech==='wraith'?'<p class="mech">'+T('Fase saat ini: {p}.',{p:['Past tense','Present and future','Perfect tense'][b.phase()]})+'</p>':'';
  return '<h2>'+T('Giliranmu')+'</h2><p>'+T('Pilih senjata untuk menyerang. Gauge ungu monster terus terisi selagi kamu berpikir.')+'</p>'+mech+ph+
    '<div class="acts wrap">'+btn('guard',T('Guard (soal pendek)'),'','')+
    btn('potion',T('Ramuan ×{n}',{n:s.potions}),'',(s.potions<=0||b.hp>=b.maxHp?'disabled':''))+
    btn('leave',T('Keluar'),'','')+'</div>'+
    '<ul class="tips"><li>'+T('Jawab cepat dan tanpa salah untuk menaikkan combo.')+'</li><li>'+T('Guard menahan {p}% serangan berikutnya jika kamu menjawab dalam {s} detik.',{p:Math.round(B.GUARD_REDUCE*100),s:B.GUARD_TIME})+'</li></ul>';
};
var LETTERED=function(w){return w.replace(/(.)$/,'<mark>$1</mark>')};
function tileLabel(t){return t.hidden?'?':esc(t.ch)}
V.puzzle=function(pz,o){
  o=o||{};
  var it=pz.cur(),body='',mutedCls=o.muted?' mute':'';
  var head='<div class="phead"><span>'+esc(o.title||'')+'</span><span>'+T('Soal {a} dari {b}',{a:pz.i+1,b:pz.items.length})+'</span></div>';
  var timer=o.timed?'<div class="trow"><div class="timer"><i id="tFill"></i></div><span class="tnum" id="tNum"></span></div>':'';
  var note=it.note?'<div class="note">'+esc(it.note)+'</div>':'';
  var optsHtml=function(){
    return '<div class="opts">'+it.opts.map(function(op,i){
      var off=it.off.indexOf(i)>=0,ok=it.done&&op===it.ans;
      return '<button type="button" class="opt'+(off?' off':'')+(ok?' ok':'')+'" data-act="opt" data-i="'+i+'"'+((off||it.done)?' disabled':'')+'>'+esc(op)+'</button>';
    }).join('')+'</div>';
  };
  if(it.type==='scramble'||it.type==='order'){
    var isOrder=it.type==='order',sm=(isOrder||it.answer.length>7)?' sm':'';
    var used=it.slots.filter(function(x){return x!==null});
    var slots=it.slots.map(function(id,idx){
      return '<button type="button" class="slot'+(id!==null?' filled':'')+(it.done?' ok':'')+(isOrder?' word':'')+'" data-act="slot" data-i="'+idx+'"'+(it.done?' disabled':'')+' aria-label="'+T('Posisi {n}',{n:idx+1})+'">'+(id===null?'':tileLabel(it.tiles[id]))+'</button>';
    }).join('');
    var tiles=it.tiles.map(function(t){
      return '<button type="button" class="tile'+(isOrder?' word':'')+'" data-act="tile" data-id="'+t.id+'"'+((used.indexOf(t.id)>=0||it.done)?' disabled':'')+'>'+tileLabel(t)+'</button>';
    }).join('');
    if(isOrder) body='<p class="ask prompt'+mutedCls+'">'+T('Susun kata menjadi kalimat yang benar. Kata pertama sudah dikunci.')+'</p><div class="slots'+sm+'"><span class="slot locked word">'+esc(it.first)+'</span>'+slots+'</div><div class="tiles'+sm+'">'+tiles+'</div>';
    else body='<p class="ask prompt'+mutedCls+'">'+T('Susun huruf menjadi kata Inggris untuk {c}',{c:'<em>'+esc(T(it.clue))+'</em>'})+'</p><div class="slots'+sm+'">'+slots+'</div><div class="tiles'+sm+'">'+tiles+'</div>';
  }else if(it.type==='synonym'){
    body='<p class="ask prompt'+mutedCls+'">'+T(it.kind==='a'?'Pilih antonim (lawan kata) dari':'Pilih sinonim (kata yang artinya sama) dari')+'</p><div class="bigword prompt'+mutedCls+'">'+esc(it.word)+'</div>'+optsHtml();
  }else if(it.type==='fill'){
    var sent=esc(it.sentence).replace('___','<span class="blank'+(it.done?' filled':'')+'">'+(it.done?esc(it.ans):'&nbsp;')+'</span>');
    body='<p class="ask">'+T('Lengkapi kalimat')+'</p><p class="sentence prompt'+mutedCls+'">'+sent+'</p>'+optsHtml();
  }else if(it.type==='idiom'){
    body='<p class="ask">'+T('Apa arti idiom ini?')+'</p><div class="bigword idiom prompt'+mutedCls+'">'+esc(it.idiom)+'</div>'+optsHtml();
  }else{ /* chain */
    body='<p class="ask">'+T('Rantai kata: pilih kata yang diawali huruf {l}',{l:'<em>'+esc(it.letter.toUpperCase())+'</em>'})+'</p><div class="bigword prompt'+mutedCls+'">'+LETTERED(esc(it.prompt))+'</div>'+optsHtml();
  }
  var acts='<div class="acts"><button type="button" class="btn" data-act="hint"'+(it.done?' disabled':'')+'>'+T('Petunjuk (−{n})',{n:B.HINT_COST.toFixed(2)})+'</button>'+(o.cancel?'<button type="button" class="btn" data-act="cancel">'+T('Batal')+'</button>':'')+'</div>';
  return head+timer+note+body+acts;
};
V.battlePanel=function(b){
  if(b.attack){
    var a=b.attack,title=a.kind==='guard'?T('Guard'):a.ws.w.short;
    return V.puzzle(a.pz,{title:title,timed:true,cancel:true,muted:false});
  }
  return V.battleIdle(b);
};

V.resultWin=function(b){

  lines+='<li>Gold <b>+'+s.gold+'</b></li>';

    return '<div class="swatches">'+arr.map(function(c,i){return '<button type="button" class="sw'+(cur===i?' on':'')+'" data-act="cfg" data-k="'+key+'" data-v="'+i+'" style="background:'+c+'" aria-label="'+T('Warna {n}',{n:i+1})+'" aria-pressed="'+(cur===i?'true':'false')+'"></button>'}).join('')+'</div>';

    body='<h3>'+T('Bentuk badan')+'</h3><div class="itemgrid">'+WB.BODIES.map(function(b){return '<button type="button" class="item'+(cfg.body===b.id?' on':'')+'" data-act="cfg" data-k="body" data-v="'+b.id+'" aria-pressed="'+(cfg.body===b.id?'true':'false')+'"><span class="ithumb">'+A.thumb('outfit',withCfg('body',b.id),54)+'</span><span class="iname">'+esc(T(b.name))+'</span></button>'}).join('')+'</div>'+
      '<h3>'+T('Tinggi')+'</h3><input type="range" id="heightRange" min="0" max="100" value="'+Math.round((cfg.height==null?.5:cfg.height)*100)+'" aria-label="'+T('Tinggi badan')+'">'+
      '<h3>'+T('Warna kulit')+'</h3>'+sw('skin',WB.SKINS,cfg.skin)+'<h3>'+T('Warna mata')+'</h3>'+sw('eye',WB.EYES,cfg.eye);
  }else if(tab==='hair'){
    body='<h3>'+T('Warna rambut')+'</h3>'+sw('hairColor',WB.HAIR_COLORS,cfg.hairColor)+'<h3>'+T('Gaya rambut')+'</h3>'+WB.HAIR_GROUPS.map(function(g){
      var list=WB.HAIR_STYLES.filter(function(h){return h.g===g[0]});
      return '<h4 class="sub">'+T(g[1])+' <span class="cnt">'+list.length+'</span></h4><div class="itemgrid">'+list.map(function(h){return itemBtn('hair','hairStyle',h,cfg.hairStyle)}).join('')+'</div>';
    }).join('');
  }else if(tab==='outfit'){
    body='<h3>'+T('Baju')+'</h3><div class="itemgrid">'+WB.OUTFITS.map(function(o){return itemBtn('outfit','outfit',o,cfg.outfit)}).join('')+'</div><h3>'+T('Warna baju')+'</h3>'+sw('dye',WB.DYES,cfg.dye);
  }else{
    body=['hat','face','neck','back'].map(function(slot){
      return '<h3>'+T(WB.ACC[slot].label)+'</h3><div class="itemgrid">'+WB.ACC[slot].items.map(function(it){return itemBtn(slot,slot,it,cfg[slot])}).join('')+'</div>';
    }).join('');
  }
  return '<div class="creator"><div class="cpreview">'+A.playerSvg(cfg,s.weapon,170)+'</div>'+tabsHtml+'<div class="cbodyc">'+body+'</div></div>';

<script>
/* Wordbound: jembatan iklan reward. Di Android dipanggil lewat AndroidAds (AdMob, lihat AdsBridge.java).
   Di browser/demo memakai iklan simulasi supaya alurnya bisa diuji tanpa SDK. DOM-free. */
(function(root){
'use strict';
var WB=root.WB=root.WB||{}, AD=WB.ads={}, pending=null;
function nat(){try{return root.AndroidAds||null}catch(e){return null}}
AD.simulator=null; /* diisi ui.js: function(done(ok)) */
AD.isNative=function(){return !!nat()};
AD.ready=function(){var n=nat();if(!n) return true;try{return !!n.isReady()}catch(e){return false}};
/* cb(ok) dipanggil tepat sekali; ok=true hanya jika pemain menonton sampai hadiah diberikan */
AD.show=function(placement,cb){
  if(pending){cb(false);return}
  var n=nat();
  var done=function(ok){if(!pending) return;var f=pending;pending=null;f(!!ok)};
  pending=cb;
  if(n){try{n.show(String(placement))}catch(e){done(false)}}
  else if(AD.simulator) AD.simulator(done);
  else done(true);
};
AD.onResult=function(ok){if(!pending) return;var f=pending;pending=null;f(!!ok)}; /* dipanggil Java */
AD.busy=function(){return !!pending};
AD.privacyRequired=function(){var n=nat();try{return !!(n&&n.privacyRequired&&n.privacyRequired())}catch(e){return false}};
AD.showPrivacy=function(){var n=nat();try{if(n&&n.showPrivacy) n.showPrivacy()}catch(e){}};
})(typeof window!=='undefined'?window:globalThis);

</script>
<script>
/* Wordbound: jembatan pembelian dalam aplikasi (Google Play Billing lewat AndroidBilling, lihat BillingBridge.java).
   Di browser/demo ada simulasi supaya alurnya bisa dicoba tanpa uang. DOM-free. */
(function(root){
'use strict';
var WB=root.WB=root.WB||{}, IAP=WB.iap={prices:{}};
function nat(){try{return root.AndroidBilling||null}catch(e){return null}}
IAP.simulator=null;   /* diisi ui.js: function(pack, done(ok)) */
IAP.onGranted=null;   /* diisi ui.js: function(pack) */
IAP.onFail=null;      /* diisi ui.js: function(code) */
IAP.isNative=function(){return !!nat()};
IAP.ready=function(){var n=nat();if(!n) return true;try{return !!n.isReady()}catch(e){return false}};
function fmtIdr(n){return 'Rp '+String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.')}
IAP.pack=function(id){for(var i=0;i<WB.IAP_PACKS.length;i++) if(WB.IAP_PACKS[i].id===id) return WB.IAP_PACKS[i];return null};
/* harga: dari Play (sudah sesuai mata uang pemain) atau cadangan Rupiah */
IAP.price=function(id){var p=IAP.pack(id);return IAP.prices[id]||(p?fmtIdr(p.idr):'')};
IAP.setPrices=function(map){if(map&&typeof map==='object') for(var k in map) IAP.prices[k]=String(map[k])}; /* dipanggil Java */
IAP.savePct=function(id){var p=IAP.pack(id),b=WB.IAP_PACKS[0];if(!p||p===b) return 0;return Math.round((1-(p.idr/p.shards)/(b.idr/b.shards))*100)};
IAP.buy=function(id){
  var p=IAP.pack(id);if(!p){IAP.fail('unavailable');return}
  var n=nat();
  if(n){try{n.buy(id)}catch(e){IAP.fail('error')}return}
  if(IAP.simulator) IAP.simulator(p,function(ok){
    if(ok) WB.core.grantPurchase(id,'sim-'+Date.now()+'-'+Math.floor(Math.random()*1e6));
    else IAP.fail('cancelled');
  });
  else WB.core.grantPurchase(id,'sim-'+Date.now());
};
IAP.fail=function(code){if(IAP.onFail) IAP.onFail(String(code))};
/* dipanggil Java; nilai kembali "true" memberi tahu Java bahwa shard sudah dikreditkan sehingga pembelian boleh di-consume */
IAP.onPurchase=function(id,token){return !!WB.core.grantPurchase(id,token)};
IAP.refresh=function(){var n=nat();try{if(n&&n.refresh) n.refresh()}catch(e){}};
})(typeof window!=='undefined'?window:globalThis);

<script>
/* Wordbound: audio. Semua suara dibuat langsung dengan WebAudio (tanpa berkas audio):
   efek suara lembut, musik lobi ceria, musik pertarungan tegang yang makin intens. */
(function(root){
'use strict';
var WB=root.WB=root.WB||{};
var AU=WB.audio={};

/* ---------- Pengaturan volume ---------- */
function cfg(){
  var s=(WB.core&&WB.core.save&&WB.core.save.settings)||{};
  var n=function(v,d){return typeof v==='number'?Math.max(0,Math.min(100,v)):d};
  return {sound:s.sound!==false,music:s.music!==false,master:n(s.vMaster,80),mus:n(s.vMusic,60),sfx:n(s.vSfx,80)};
}
function curve(v){return (v/100)*(v/100)} /* kurva kuadrat agar geser volume terasa halus */
var MASTER_K=1.5,MUSIC_K=2.1,SFX_K=2.4; /* penguat dasar: pada setelan bawaan musik puncak sekitar -6 dB, efek sekitar -3 dB */
function mtof(m){return 440*Math.pow(2,(m-69)/12)}

/* ---------- Konteks dan jalur (bus) ---------- */
var ctx=null,master=null,musicBus=null,sfxBus=null,tg=null;
var cur=null,want=null,hold=false,boss=false,intensity=0,nextTime=0,nextBar=0,timer=null,pausedByUs=false;

function noiseOf(c){
  if(c.__noise) return c.__noise;
  var len=c.sampleRate,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
  for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
  c.__noise=buf;return buf;
}
function buildGraph(c){
  var m=c.createGain(),comp=c.createDynamicsCompressor();
  comp.threshold.value=-8;comp.knee.value=6;comp.ratio.value=14;comp.attack.value=0.003;comp.release.value=0.15;
  var mb=c.createGain(),sb=c.createGain();
  mb.connect(m);sb.connect(m);m.connect(comp);comp.connect(c.destination);
  return {master:m,music:mb,sfx:sb};
}
function applyVolumes(){
  if(!ctx||!master) return;
  var s=cfg(),t=ctx.currentTime;
  master.gain.setTargetAtTime(curve(s.master)*MASTER_K,t,0.03);
  musicBus.gain.setTargetAtTime(s.music?curve(s.mus)*MUSIC_K:0,t,0.05);
  sfxBus.gain.setTargetAtTime(s.sound?curve(s.sfx)*SFX_K:0,t,0.03);
}

/* ---------- Instrumen sederhana ---------- */
function env(g,t,a,peak,d){
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(peak,t+a);
  g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);
}
function tone(c,dest,o){
  var osc=c.createOscillator(),g=c.createGain(),t=o.t;
  osc.type=o.type||'sine';
  osc.frequency.setValueAtTime(o.f,t);
  if(o.to) osc.frequency.exponentialRampToValueAtTime(o.to,t+(o.slide||o.d));
  if(o.detune) osc.detune.value=o.detune;
  env(g,t,o.a==null?0.004:o.a,o.v,o.d);
  var out=osc;
  if(o.lp){var f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=o.lp;osc.connect(f);out=f}
  out.connect(g);g.connect(dest);
  osc.start(t);osc.stop(t+(o.a||0.004)+o.d+0.05);
}
function bell(c,dest,t,m,d,v){ /* kalimba/lonceng: nada dasar + overtone cepat hilang */
  var f=mtof(m);
  tone(c,dest,{t:t,f:f,d:d,v:v});
  tone(c,dest,{t:t,f:f*4,d:Math.min(0.16,d),v:v*0.22});
  tone(c,dest,{t:t,f:f*2,d:d*0.5,v:v*0.18,type:'triangle'});
}
function pad(c,dest,t,m,d,v){
  var f=mtof(m);
  [-7,7].forEach(function(dt){tone(c,dest,{t:t,f:f,d:d,v:v,a:0.35,type:'triangle',detune:dt,lp:900})});
}
function bassT(c,dest,t,m,d,v){
  var f=mtof(m);
  tone(c,dest,{t:t,f:f,d:d,v:v,a:0.01,type:'triangle'});
  tone(c,dest,{t:t,f:f*2,d:d*0.7,v:v*0.35,a:0.01,type:'sine'});
}
function saw(c,dest,t,m,d,v,lp){
  tone(c,dest,{t:t,f:mtof(m),d:d,v:v,a:0.006,type:'sawtooth',lp:lp||900});
}
function kick(c,dest,t,v){
  tone(c,dest,{t:t,f:150,to:48,slide:0.12,d:0.2,v:v,a:0.002});
}
function noise(c,dest,t,d,v,ftype,freq,q,sweepTo){
  var src=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  src.buffer=noiseOf(c);f.type=ftype;f.frequency.setValueAtTime(freq,t);f.Q.value=q||0.8;
  if(sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo,t+d);
  env(g,t,0.003,v,d);
  src.connect(f);f.connect(g);g.connect(dest);
  src.start(t);src.stop(t+d+0.06);
}
function snare(c,dest,t,v){
  noise(c,dest,t,0.14,v,'bandpass',1900,0.7);
  tone(c,dest,{t:t,f:210,to:150,d:0.1,v:v*0.8,a:0.002});
}
function hat(c,dest,t,v,open){noise(c,dest,t,open?0.12:0.04,v,'highpass',7000,0.5)}

/* ---------- Lagu: lobi (C mayor, ceria) ---------- */
var CH={C:[48,52,55],Am:[45,48,52],F:[41,45,48],G:[43,47,50],Em:[40,43,47],Dm:[38,41,45],
        Aminor:[45,48,52],E:[40,44,47]};
var LOBBY_CH=['C','Am','F','G','C','Em','F','G','F','G','Em','Am','Dm','G','C','C'];
var LOBBY_MEL=[
  [[0,76,1],[1,79,.5],[1.5,76,.5],[2,74,1],[3,72,1]],
  [[0,69,1],[1,72,1],[2,76,1.5],[3.5,74,.5]],
  [[0,72,1],[1,77,1],[2,76,1],[3,72,1]],
  [[0,74,1.5],[1.5,71,.5],[2,74,1],[3,79,1]],
  [[0,76,1],[1,79,.5],[1.5,81,.5],[2,79,1],[3,76,1]],
  [[0,71,1],[1,76,1],[2,79,1],[3,76,1]],
  [[0,77,1],[1,76,.5],[1.5,74,.5],[2,72,1],[3,69,1]],
  [[0,71,1],[1,74,1],[2,67,2]],
  [[0,81,.5],[.5,79,.5],[1,77,1],[2,79,1],[3,77,1]],
  [[0,79,.5],[.5,77,.5],[1,74,1],[2,71,1],[3,74,1]],
  [[0,76,1],[1,79,1],[2,83,1],[3,79,1]],
  [[0,81,1],[1,76,1],[2,72,1],[3,76,1]],
  [[0,74,.5],[.5,77,.5],[1,81,1],[2,77,1],[3,74,1]],
  [[0,71,1],[1,74,1],[2,79,1],[3,77,.5],[3.5,74,.5]],
  [[0,76,1.5],[1.5,72,.5],[2,76,1],[3,79,1]],
  [[0,72,3]]
];
var ARP=[0,2,1,2,0,2,1,2];
function lobbyBar(c,dest,t0,bi,spb){
  var ch=CH[LOBBY_CH[bi]],root=ch[0];
  ch.forEach(function(m){pad(c,dest,t0,m+12,spb*4,0.02)});
  [[0,root,.9,.12],[1.5,root,.4,.07],[2,root+7,.9,.1],[3,root,.9,.09]].forEach(function(n){bassT(c,dest,t0+n[0]*spb,n[1],n[2]*spb,n[3])});
  for(var i=0;i<8;i++) bell(c,dest,t0+i*spb*.5,ch[ARP[i]]+12,spb*.8,0.05);
  LOBBY_MEL[bi].forEach(function(n){bell(c,dest,t0+n[0]*spb,n[1],Math.max(.35,n[2]*spb*1.1),0.13)});
  kick(c,dest,t0,0.2);kick(c,dest,t0+2*spb,0.16);
  for(var j=0;j<8;j++) noise(c,dest,t0+j*spb*.5,0.05,j%2?0.045:0.028,'highpass',6500,0.5);
  if(bi%2===1) noise(c,dest,t0+3*spb,0.08,0.05,'bandpass',2500,0.9); /* tepuk lembut */
}

/* ---------- Lagu: pertarungan (A minor, tegang) ---------- */
var BATTLE_CH=['Aminor','Aminor','F','E','Aminor','G','F','E'];
var BATTLE_MEL=[
  [[0,69,.5],[.5,72,.5],[1,76,1],[2,74,.5],[2.5,72,.5],[3,71,1]],
  [[0,69,.5],[.5,72,.5],[1,76,1],[2,77,1],[3,76,1]],
  [[0,72,.5],[.5,77,.5],[1,81,1],[2,79,.5],[2.5,77,.5],[3,76,1]],
  [[0,76,.5],[.5,80,.5],[1,83,1],[2,80,1],[3,76,1]],
  [[0,69,.5],[.5,72,.5],[1,76,1],[2,81,1],[3,79,1]],
  [[0,74,1],[1,79,1],[2,78,.5],[2.5,74,.5],[3,71,1]],
  [[0,77,1],[1,76,.5],[1.5,74,.5],[2,72,2]],
  [[0,71,.5],[.5,74,.5],[1,76,.5],[1.5,80,.5],[2,83,2]]
];
var B_BASS=[0,0,12,0,0,0,12,7];
function battleBar(c,dest,t0,bi,spb,opt){
  var lvl=Math.max(opt.intensity,opt.boss?1:0),ch=CH[BATTLE_CH[bi]],root=ch[0];
  /* ritme */
  var hard=lvl>=1||opt.boss;
  kick(c,dest,t0,0.5);kick(c,dest,t0+2*spb,0.46);
  if(hard){kick(c,dest,t0+spb,0.34);kick(c,dest,t0+3*spb,0.34)}else kick(c,dest,t0+3.5*spb,0.22);
  snare(c,dest,t0+spb,0.2);snare(c,dest,t0+3*spb,0.22);
  var steps=lvl>=2?16:8,st=4*spb/steps;
  for(var i=0;i<steps;i++) hat(c,dest,t0+i*st,i%2?0.035:0.05,false);
  /* bas berdenyut */
  for(var k=0;k<8;k++){
    var m=root+12+B_BASS[k];
    saw(c,dest,t0+k*spb*.5,m,spb*.42,k%4===0?0.12:0.085,520);
  }
  tone(c,dest,{t:t0,f:mtof(root),d:spb*3.9,v:0.1,a:0.02,type:'sine'});
  /* tegang bertahap */
  if(lvl>=1){
    ch.forEach(function(n){saw(c,dest,t0,n+12,spb*3.8,0.026,1100)});
    BATTLE_MEL[bi].forEach(function(n){
      var d=Math.max(.3,n[2]*spb*.95);

var TRACKS={

  battle:{bpm:140,bars:8,bar:function(c,d,t,bi,o){battleBar(c,d,t,bi,o.spb,o)},spb:function(o){return 60/(o.boss?152:140)}}
};

/* ---------- Penjadwal musik ---------- */
function opts(){var o={intensity:intensity,boss:boss};o.spb=TRACKS[cur||'battle'].spb(o);return o}
function schedule(){

    nextTime+=4*o.spb;nextBar=(nextBar+1)%tr.bars;

  if(timer){root.clearInterval(timer);timer=null}
}

  if(!ctx||ctx.state==='suspended'&&pausedByUs) return;

/* ---------- Efek suara ---------- */
var SFX={
  tap:function(c,d,t){tone(c,d,{t:t,f:620,to:900,slide:0.05,d:0.08,v:0.2,a:0.003})},
  ok:function(c,d,t){bell(c,d,t,88,0.28,0.2);bell(c,d,t+0.075,91,0.34,0.2)},

  coin:function(c,d,t){bell(c,d,t,95,0.22,0.17);bell(c,d,t+0.07,100,0.4,0.17)},

AU.render=function(name,bars,o){

  var tr=TRACKS[name],sr=o.sampleRate||32000,op={intensity:o.intensity||0,boss:!!o.boss};

};

function fxReset(){fxItems=[];if(E.fx) E.fx.innerHTML=''}
function spokes(col,n,w){
  var h='<g transform="translate('+MX+' '+MY+')">';
  for(var i=0;i<n;i++) h+='<g transform="rotate('+Math.round(360/n*i)+')"><path class="spk" d="M0 -10L0 -26" stroke="'+col+'" stroke-width="'+(w||5)+'" stroke-linecap="round" style="animation-delay:'+(i%2?'.03':'0')+'s"/></g>';
  return h+'</g>';
}
function impactSvg(w){
  var st=WSTYLE[w]||WSTYLE.quill,h='';
  if(st.fx==='slash') h='<g transform="translate('+MX+' '+MY+')"><path class="slash" pathLength="60" stroke-dasharray="60" d="M-30 -26L30 26" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none"/><path class="slash" pathLength="60" stroke-dasharray="60" d="M-30 -26L30 26" stroke="'+st.col+'" stroke-width="2.5" stroke-linecap="round" fill="none"/></g>'+spokes(st.col,6,4);
  else if(st.fx==='spark') h=spokes(st.col,8,4);
  else if(st.fx==='ring') h='<g transform="translate('+MX+' '+(MY+22)+')"><circle class="ring" r="16" fill="none" stroke="'+st.col+'" stroke-width="6"/><circle class="ring" r="10" fill="none" stroke="#fff" stroke-width="3" style="animation-delay:.06s"/></g>'+spokes(st.col,10,6);
  else h=spokes(st.col,8,5)+'<g transform="translate('+MX+' '+MY+')"><circle class="ring" r="12" fill="'+st.col+'" opacity=".5"/></g>';
  return h;
}
function shotSvg(w){
  var dx=(MX-PX-14)+'px';
  var fxk=(WSTYLE[w]||{}).fx;
  if(fxk==='arrow') return '<g transform="translate('+PX+' '+(PY+4)+')"><g class="arrow" style="--dx:'+dx+'"><path d="M-24 0L8 0" stroke="#8A6A55" stroke-width="3.5" stroke-linecap="round"/><path d="M8 -6L21 0L8 6Z" fill="#C9D4DC" stroke="#3B2F2F" stroke-width="2"/><path d="M-24 0L-31 -5M-24 0L-31 5" stroke="#F27D72" stroke-width="3" stroke-linecap="round"/></g></g>';
  if(fxk==='letters'){
    var L=['W','O','R','D','S'],dy=[-26,-10,4,-34,12],h='<g transform="translate('+PX+' '+(PY-6)+')">';
    for(var i=0;i<5;i++) h+='<text class="projl" text-anchor="middle" style="--dx:'+dx+';--dy:'+dy[i]+'px;animation-delay:'+(i*.05)+'s">'+L[i]+'</text>';
    return h+'</g>';
  }
  return '<g transform="translate('+PX+' '+PY+')"><circle class="proj" r="10" fill="#B9AEF0" stroke="#3B2F2F" stroke-width="3" style="--dx:'+dx+'"/><circle class="proj" r="4" cx="-3" cy="-3" fill="#fff" style="--dx:'+dx+'"/></g>';
}
function confettiSvg(){
  var cols=['#F27D72','#F6C453','#4FB0A5','#9B8FD1','#7EC4E8','#F2A6B8','#7DB46C'],h='';
  for(var i=0;i<26;i++){
    var x=16+(i*15.1)%368,dx=((i*37)%61)-30,rot=180+(i*53)%360,d=((i*7)%10)/10*.7;
    h+='<rect class="conf" x="'+x.toFixed(0)+'" y="-6" width="7" height="11" rx="1.5" fill="'+cols[i%cols.length]+'" stroke="#3B2F2F" stroke-width="1.2" style="--cx:'+dx+'px;--cr:'+rot+'deg;animation-delay:'+d.toFixed(2)+'s"/>';
  }
  return h;
}
function sparklesSvg(pts,col){
  return pts.map(function(p,i){return '<path class="sparkle" transform="translate('+p[0]+' '+p[1]+')" d="M0 -11L3 -3L11 0L3 3L0 11L-3 3L-11 0L-3 -3Z" fill="'+(col||'#F6C453')+'" stroke="#3B2F2F" stroke-width="1.5" style="animation-delay:'+(i*.08)+'s"/>'}).join('');
}
function wepNode(){return E.pArt&&E.pArt.querySelector?E.pArt.querySelector('.pwep'):null}
function resetAnim(){
  if(E.pAnim) E.pAnim.setAttribute('class','fx');
  if(E.mAnim) E.mAnim.setAttribute('class','fx');
  fxReset();
}
function hitMonster(w,info){
  var big=info&&info.perfect;
  pulse(E.mAnim,big?'mhit-big':'mhit',big?600:450);
  fxAdd(impactSvg(w),700);
  sfx('hit',!!big);
}
function playAttack(dmg,info){
  var w=K.save.weapon,st=WSTYLE[w]||WSTYLE.quill,b=S.battle;
  sfx('swing',w);
  pulse(E.pAnim,st.atk,st.ms);
  var wn=wepNode();if(wn) pulse(wn,st.wep,st.ms);
  var hitAt=st.hit;
  if(st.shot){
    setTimeout(function(){if(S.battle===b){fxAdd(shotSvg(w),st.fly+250);sfx('shot',w)}},st.shot);
    hitAt=st.shot+st.fly;
  }
  setTimeout(function(){
    if(S.battle!==b||!E.mAnim) return;
    hitMonster(w,info);
    float(String(dmg),77,42,info&&info.perfect?'big':'');
    if(w==='hammer') pulse(E.arena,'shake',360);
  },hitAt);
}
function playMonsterAttack(d,b){
  var tpl=b.def.tpl;
  pulse(E.mAnim,'matk-'+tpl,950);
  setTimeout(function(){
    if(S.battle!==b||!E.pAnim) return;
    if(d.blocked){
      fxAdd('<circle class="gshield" cx="'+(PX-26)+'" cy="'+(PY+4)+'" r="44" fill="rgba(126,196,232,.35)" stroke="#7EC4E8" stroke-width="4"/>',700);
      float('BLOCK',24,40,'small');sfx('block');
    }else{
      pulse(E.arena,'hurt',460);pulse(E.pAnim,'phurt',500);
      float('−'+d.dmg,24,42,'small');sfx('hurt');buzz(60);
      if(tpl==='ogre'||tpl==='knight') pulse(E.arena,'shake',360);
    }
  },tpl==='ghost'?560:(tpl==='ogre'?600:430));
}
function playWin(big,b){
  setTimeout(function(){
    if(S.battle!==b||!E.mAnim) return;
    E.mAnim.classList.add('mdie');sfx('die');
    pulse(E.pAnim,big?'pwin':'pcheer',big?1500:900);
    var wn=wepNode();if(wn&&big) pulse(wn,'raise',1500);
    fxAdd(sparklesSvg([[MX-30,MY-30],[MX+26,MY-40],[MX,MY+10],[MX+40,MY],[MX-44,MY-4],[PX-10,PY-60],[PX+30,PY-70]],'#F6C453'),1200);
    if(big) fxAdd(confettiSvg(),2300);
  },760);
}
function playLose(b){
  setTimeout(function(){
    if(S.battle!==b||!E.pAnim) return;
    E.pAnim.classList.add('plose');
    pulse(E.mAnim,'mtaunt',900);
  },450);
}
function onBattle(t,d){
  var b=S.battle;if(!b||!E.panel) return;
  if(t==='change'){refreshBattle();return}
  if(t==='strike'){
    buzz(20);playAttack(d.dmg,d.info);
    refreshCur();return;
  }
  if(t==='mhit'){
    playMonsterAttack(d,b);
    E.cache={};paintBattle();return;
  }
  if(t==='solved'){sfx('ok');return}
  if(t==='wrong'){sfx('wrong');buzz(40);pulse(E.panel,'shake',360);return}
  if(t==='mastered'){toast(T('Kata dikuasai: +1 shard'));sfx('coin');refreshCur();return}
  if(t==='potion'){toast(T('HP pulih {n}',{n:B.POTION_HEAL}));sfx('potion');return}
  if(t==='guard'){sfx(d.ok?'ok':'wrong');return}
  if(t==='fight'){
    resetAnim();AU.play('battle');
    if(E.mArt){E.mArt.innerHTML=A.monster(b.def);}
    refreshBattle();return;
  }
  if(t==='fightwon'){
    AU.jingle('win');refreshCur();playWin(false,b);
    setTimeout(function(){if(S.battle===b&&b.state==='won') showModal(V.fightWon(b,d.gold),[{act:'mnext',label:T('Lanjut'),cls:'primary'}])},1700);return;
  }
  if(t==='cleared'){
    AU.jingle('clear');refreshCur();playWin(true,b);
    setTimeout(function(){if(S.battle===b) showModal(V.resultWin(b),[{act:'mfinish',label:T('Lanjut'),cls:'primary'}])},2400);return;
  }
  if(t==='revive'){
    resetAnim();AU.play('battle');sfx('potion');buzz(30);
    E.pAnim&&pulse(E.pAnim,'pcheer',700);refreshBattle(true);return;
  }
  if(t==='lose'){
    AU.jingle('lose');playLose(b);
    setTimeout(function(){if(S.battle===b) showModal(V.resultLose(b),(b.canRevive()?[{act:'adrevive',label:T('Tonton iklan: pulihkan {n} HP dan lanjut',{n:B.AD_REVIVE_HP}),cls:'primary'}]:[]).concat([{act:'mretry',label:T('Coba lagi'),cls:b.canRevive()?'':'primary'},{act:'mleave',label:T('Kembali ke peta')}]))},1300);
  }
}

/* ---------- Alur cerita ---------- */
function playStory(lines,bg,after){
  S.story={lines:lines,idx:0,bg:bg,after:after};
  go('story');
}
function endStory(){
  var f=S.story&&S.story.after;S.story=null;
  if(f) f();else go('map');
}
function startBattle(ch,st,challenge){
  S.battle=null;
  var b=new K.Battle({ch:ch,stage:st,challenge:challenge,on:function(t,d){onBattle(t,d)}});
  S.battle=b;S.screen='battle';S.rift=null;
  render();
}
function openStage(ch,st){
  S.stageSel={ch:ch,st:st,challenge:false};go('stage');
}
function finishAfterClear(){
  var b=S.battle,res=b.result;hideModal();
  if(res.chapterDone){
    var c=b.chapter,key='outro'+b.ch;
    var done=function(){S.battle=null;if(res.ending){S.ending=null;go('ending')}else go('map')};
    if(!K.save.seen[key]){K.save.seen[key]=true;K.persist();playStory(c.outro,c.bg,done);return}
    done();return;
  }
  S.battle=null;go('map');
}

/* ---------- Rift ---------- */
function renderRiftPanel(){
  var r=S.rift,p=$('#panel');if(!r||!p) return;
  p.innerHTML=V.riftRun(r);
}
function startRift(){
  S.rift=new K.Rift({on:function(t){
    if(t==='change'){renderRiftPanel()}
    else if(t==='solved') sfx('ok');
    else if(t==='wrong'){sfx('wrong');pulse($('#panel'),'shake',360)}
    else if(t==='mastered'){toast(T('Kata dikuasai: +1 shard'));sfx('coin')}
    else if(t==='done'){AU.jingle('win');render();refreshCur()}
  }});
  S.screen='rift';render();
}

/* ---------- Event klik ---------- */
function puzzleOf(){
  if(S.screen==='battle'&&S.battle&&S.battle.attack) return S.battle.attack.pz;
  if(S.screen==='rift'&&S.rift&&S.rift.state==='run') return S.rift.pz;
  return null;
}
function afterPuzzleInput(res){
  if(res==='placed'||res==='removed') sfx('tap');
  if(S.screen==='battle') refreshBattle();else if(S.screen==='rift') renderRiftPanel();
}
function act(name,el){
  var d=el?el.dataset:{};
  var pz;
  switch(name){
    case 'go':go(d.to);break;
    case 'back':UI.back();break;
    case 'continue':{var nx=K.nextStage();if(nx) openStage(nx.ch,nx.stage);else go('map');break}
    case 'stage':openStage(parseInt(d.ch,10),parseInt(d.st,10));break;
    case 'challenge':S.stageSel.challenge=!S.stageSel.challenge;render();break;
    case 'fight':{
      var ch=parseInt(d.ch,10),st=parseInt(d.st,10),c=WB.CHAPTERS[ch],chal=S.stageSel&&S.stageSel.challenge;
      var key='intro'+ch;
      if(st===1&&!K.save.seen[key]){K.save.seen[key]=true;K.persist();playStory(c.intro,c.bg,function(){startBattle(ch,st,chal)})}
      else startBattle(ch,st,chal);
      break;
    }
    case 'nextstory':if(S.story.idx<S.story.lines.length-1){S.story.idx++;render()}else endStory();break;
    case 'skipstory':endStory();break;
    /* pertarungan */
    case 'attack':if(S.battle){K.save.weapon=d.w;sfx('tap');S.battle.startAttack(d.w)}break;
    case 'guard':if(S.battle){sfx('tap');S.battle.startGuard()}break;
    case 'potion':if(S.battle) S.battle.usePotion();break;
    case 'leave':
      showModal('<h2>'+T('Keluar dari pertarungan?')+'</h2><p>'+T('Kemajuan tahap ini tidak disimpan. Hadiah dari pertarungan yang sudah kamu dapat tetap ada.')+'</p>',[{act:'mstay',label:T('Tetap bertarung'),cls:'primary'},{act:'mleave',label:T('Keluar')}]);break;
    case 'cancel':if(S.battle){S.battle.cancel()}break;
    case 'hint':pz=puzzleOf();if(pz){var ok=pz.hint();if(ok) sfx('tap');afterPuzzleInput('hint')}break;
    case 'tile':pz=puzzleOf();if(pz){afterPuzzleInput(pz.tile(parseInt(d.id,10)))}break;
    case 'slot':pz=puzzleOf();if(pz){afterPuzzleInput(pz.slot(parseInt(d.i,10)))}break;
    case 'opt':pz=puzzleOf();if(pz){afterPuzzleInput(pz.opt(parseInt(d.i,10)))}break;
    /* modal */
    case 'mstay':hideModal();break;
    case 'daily':showDaily();break;
    case 'savename':{var inp=$('#profName'),rn=K.setName(inp?inp.value:'');toast(rn.msg);sfx('ok');render();break}
    case 'setavatar':{var ra=K.setAvatar(d.v);toast(ra.msg);sfx(ra.ok?'ok':'wrong');render();break}
    case 'dclose':hideModal();break;
    case 'dclaim':{var dr=K.claimDaily();toast(dr.msg);sfx(dr.ok?'coin':'wrong');if(dr.ok) buzz(30);refreshCur();if(S.screen==='hub') render();showDaily();break}
    case 'mnext':hideModal();if(S.battle) S.battle.nextFight();break;
    case 'mretry':{hideModal();var b=S.battle;startBattle(b.ch,b.stage,b.challenge);break}
    case 'mleave':hideModal();S.battle=null;go('map');break;
    case 'mfinish':finishAfterClear();break;
    /* karakter */
    case 'ctab':S.ctab=d.tab;S.preview=null;render();break;
    case 'cfg':{
      var key2=d.k,val=d.v;
      if(['skin','eye','hairColor','dye'].indexOf(key2)>=0) val=parseInt(val,10);
      if(K.setCfg(key2,val)){sfx('tap');render()}
      break;
    }
    case 'buy':{
      var r=K.buyCosmetic(d.slot,d.v);toast(r.msg);
      if(r.ok){K.setCfg(d.k,d.v);sfx('coin')}else sfx('wrong');
      render();break;
    }
    /* toko */
    case 'stab':S.stab=d.tab;render();break;
    case 'buyw':{var r1=K.buyWeapon(d.w);toast(r1.msg);sfx(r1.ok?'coin':'wrong');render();break}
    case 'equip':if(K.setWeapon(d.w)){sfx('tap');render()}break;
    case 'upgrade':{var r2=K.upgradeWeapon(d.w);toast(r2.msg);sfx(r2.ok?'coin':'wrong');render();break}
    case 'buypotion':{var r3=K.buyPotion();toast(r3.msg);sfx(r3.ok?'coin':'wrong');render();break}
    /* kodeks, rift */
    case 'cfilter':S.cfilter=d.tab;render();break;
    case 'riftstart':startRift();break;
    /* pengaturan */
    case 'toggle':K.setSetting(d.k,!K.save.settings[d.k]);applyPrefs();sfx('tap');render();break;
    case 'adshards':{
      if(K.adsLeft()<=0){toast(T('Batas harian tercapai. Kembali lagi besok.'));break}
      WB.ads.show('shards',function(ok){
        if(!ok){toast(T('Iklan belum selesai atau belum siap. Coba lagi sebentar lagi.'));return}
        var r=K.claimAdShards();toast(r.msg);sfx(r.ok?'coin':'wrong');refreshCur();if(S.screen==='shop') render();
      });break}
    case 'adrevive':{
      var rb=S.battle;if(!rb||!rb.canRevive()){break}
      WB.ads.show('revive',function(ok){
        if(!ok){toast(T('Iklan belum selesai atau belum siap. Coba lagi sebentar lagi.'));return}
        if(S.battle===rb&&rb.revive()){hideModal();toast(T('HP pulih {n}. Lanjutkan bertarung!',{n:B.AD_REVIVE_HP}))}
      });break}
    case 'buyiap':{
      if(K.isDemo()){toast(T('Pembelian dinonaktifkan di akun demo.'));break}
      if(!WB.iap.ready()){toast(T('Produk belum tersedia. Coba lagi sebentar lagi.'));WB.iap.refresh();break}
      WB.iap.buy(d.id);break}
    case 'adprivacy':WB.ads.showPrivacy();break;
    case 'lang':K.setSetting('lang',d.v);applyPrefs();render();break;
    case 'theme':K.setSetting('theme',d.v);applyPrefs();render();break;
    case 'demoon':K.enterDemo(false);applyPrefs();S.battle=null;S.rift=null;toast(T('Akun demo aktif: semua terbuka'));go('hub');break;
    case 'demooff':K.exitDemo();applyPrefs();S.battle=null;S.rift=null;toast(T('Kembali ke akun asli'));go('hub');break;
    case 'reset':S.confirmReset=true;render();break;
    case 'resetno':S.confirmReset=false;render();break;
    case 'resetgo':K.reset();applyPrefs();S.confirmReset=false;toast(T('Progres dihapus.'));go('hub');break;
    /* ending */
    case 'ending':K.setEnding(d.v);S.ending=d.v;render();break;
  }
}
function onClick(e){
  var el=e.target.closest?e.target.closest('[data-act]'):null;
  if(!el||el.disabled) return;
  if(S.modal&&!overlay.contains(el)) return;
  act(el.getAttribute('data-act'),el);
  if(S.screen!=='battle') refreshCur();
}
UI.act=act;

/* tombol Back Android: mengembalikan true jika ditangani di dalam game */
UI.back=function(){
  if(S.modal){
    if(S.battle&&S.battle.over) return true;
    hideModal();return true;
  }
  switch(S.screen){
    case 'hub':return false;
    case 'battle':act('leave');return true;
    case 'story':endStory();return true;
    case 'stage':go('map');return true;
    case 'ending':if(S.ending||K.save.ending){S.ending=null;go('hub')}return true;
    default:go('hub');return true;
  }
};

/* ---------- Loop ---------- */
var last=0;
function tick(now){
  var dt=Math.min(0.1,Math.max(0,(now-last)/1000));last=now;
  if(S.screen==='battle'&&S.battle&&!S.modal){
    var b=S.battle;
    b.tick(dt);
    paintBattle();
  }else if(S.screen==='rift'&&S.rift&&S.rift.state==='run'){
    S.rift.tick(dt);
  }
  root.requestAnimationFrame(tick);
}

UI.init=function(){
  main=$('#screen');overlay=$('#overlay');toastEl=$('#toast');topbar=$('#topbar');
  if(root.location&&root.location.hash==='#demo'&&!K.isDemo()) K.enterDemo(false);else K.load();
  applyPrefs();
  WB.ads.simulator=function(done){
    var d=doc.createElement('div'),n=5,tm=null;d.className='adsim';
    d.innerHTML='<div class="card" role="dialog" aria-modal="true"><h2>'+T('Iklan contoh')+'</h2><p class="soft">'+T('Ini simulasi iklan untuk uji coba. Di aplikasi Android, iklan asli dari Google AdMob tampil di sini.')+'</p><div class="adfake" aria-hidden="true">AD</div><p class="adcount" id="adCount"></p><div class="acts col"><button type="button" class="btn primary" id="adClaim" disabled></button><button type="button" class="btn" id="adSkip">'+T('Tutup iklan')+'</button></div></div>';
    doc.body.appendChild(d);
    var cnt=d.querySelector('#adCount'),claim=d.querySelector('#adClaim');
    var fin=function(ok){clearInterval(tm);if(d.parentNode) d.parentNode.removeChild(d);done(ok)};
    var paint=function(){
      if(n>0){cnt.textContent=T('Iklan selesai dalam {n} detik',{n:n});claim.textContent=T('Tunggu...')}
      else{cnt.textContent='';claim.textContent=T('Ambil hadiah');claim.disabled=false}
    };
    paint();
    tm=root.setInterval(function(){n--;paint();if(n<=0) clearInterval(tm)},1000);
    claim.addEventListener('click',function(e){e.stopPropagation();fin(true)});
    d.querySelector('#adSkip').addEventListener('click',function(e){e.stopPropagation();fin(false)});
  };
  WB.iap.onGranted=function(pack,demo){
    toast(T('+{n} shard. Terima kasih!',{n:pack.shards}));sfx('coin');buzz(30);
    if(!demo){refreshCur();if(S.screen==='shop') render()}
  };
  WB.iap.onFail=function(code){
    if(code==='cancelled') return;
    toast(T(code==='pending'?'Pembayaran tertunda. Shard akan masuk setelah pembayaran selesai.':(code==='unavailable'?'Produk belum tersedia. Coba lagi sebentar lagi.':'Pembelian gagal. Coba lagi nanti.')));
  };
  WB.iap.simulator=function(pack,done){
    var d=doc.createElement('div');d.className='adsim';
    d.innerHTML='<div class="card" role="dialog" aria-modal="true"><h2>'+T('Pembelian contoh')+'</h2><p class="soft">'+T('Ini simulasi pembelian untuk uji coba. Tidak ada uang yang dipakai.')+'</p><div class="adfake" aria-hidden="true">'+T('{n} Shard',{n:pack.shards})+'</div><p class="adcount">'+V.esc(WB.iap.price(pack.id))+'</p><div class="acts col"><button type="button" class="btn primary" id="iapOk">'+T('Beli (simulasi)')+'</button><button type="button" class="btn" id="iapNo">'+T('Batal')+'</button></div></div>';
    doc.body.appendChild(d);
    var fin=function(ok){if(d.parentNode) d.parentNode.removeChild(d);done(ok)};
    d.querySelector('#iapOk').addEventListener('click',function(e){e.stopPropagation();fin(true)});
    d.querySelector('#iapNo').addEventListener('click',function(e){e.stopPropagation();fin(false)});
  };
  WB.iap.refresh();
  doc.addEventListener('click',onClick);
  var VOL={volMaster:'vMaster',volMusic:'vMusic',volSfx:'vSfx'};
  doc.addEventListener('input',function(e){
    if(e.target&&VOL[e.target.id]){
      var v=Math.max(0,Math.min(100,parseInt(e.target.value,10)||0));
      K.save.settings[VOL[e.target.id]]=v;AU.applyVolumes();
      var lab=$('#'+e.target.id+'V');if(lab) lab.textContent=v+'%';return;
    }
    if(e.target&&e.target.id==='heightRange'){
      var cfg=Object.assign({},K.save.cfg);cfg.height=e.target.value/100;S.preview=cfg;
      var pv=$('.cpreview');if(pv) pv.innerHTML=A.playerSvg(cfg,K.save.weapon,170);
    }
  });
  doc.addEventListener('change',function(e){
    if(e.target&&VOL[e.target.id]){K.persist();if(e.target.id==='volSfx'){sfx('ok');sfx('hit',true)}else sfx('tap');return}
    if(e.target&&e.target.id==='heightRange'){K.setCfg('height',e.target.value/100);S.preview=null}
  });
  render();
  if(S.screen==='hub'&&!S.dailyShown&&K.dailyState().canClaim){S.dailyShown=true;showDaily()}
  last=root.performance?root.performance.now():0;
  root.requestAnimationFrame(function(t){last=t;root.requestAnimationFrame(tick)});
};
if(doc&&doc.readyState!=='loading'&&doc.getElementById('screen')) UI.init();
else if(doc) doc.addEventListener('DOMContentLoaded',UI.init);

})(typeof window!=='undefined'?window:globalThis);

</script>
