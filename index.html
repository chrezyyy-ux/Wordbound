:root{
  --paper:#FFF6E5; --paper-2:#F8E9CD; --ink:#3B2F2F; --ink-soft:#6B5A52; --edge:#3B2F2F; --line:#3B2F2F;
  --teal:#4FB0A5; --coral:#F27D72; --butter:#F6C453; --lav:#9B8FD1; --moss:#7DB46C; --sky:#7EC4E8; --pink:#F2A6B8;
  --hud:rgba(255,246,229,.93); --bar-bg:#FFFFFF; --tile-ink:#3B2F2F; --shadow:rgba(59,47,47,.28); --dot:rgba(59,47,47,.07);
  --display:'Scribble','Segoe Print','Bradley Hand','Comic Sans MS',cursive; --body:'OutfitLocal','Nunito','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#2A2330; --paper-2:#372E3F; --ink:#F3E6D3; --ink-soft:#C2B3A3; --edge:#D9C7AE; --line:#1A1420;
    --hud:rgba(42,35,48,.92); --bar-bg:#1F1A24; --shadow:rgba(0,0,0,.45); --dot:rgba(243,230,211,.06); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#2A2330; --paper-2:#372E3F; --ink:#F3E6D3; --ink-soft:#C2B3A3; --edge:#D9C7AE; --line:#1A1420;
  --hud:rgba(42,35,48,.92); --bar-bg:#1F1A24; --shadow:rgba(0,0,0,.45); --dot:rgba(243,230,211,.06); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:20px 20px;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;
  padding-block:10px 28px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;overscroll-behavior-y:contain;user-select:none;-webkit-user-select:none}
.app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
main{display:flex;flex-direction:column;gap:12px;min-width:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
button:disabled{cursor:default}
h1,h2,h3{margin:0;font-weight:400}
h2{font:400 26px/1.1 var(--display)}
h3{font:700 13px var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);margin:14px 0 6px}
p{margin:0 0 8px}
.soft{color:var(--ink-soft);font-size:13.5px}
.right{text-align:right}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.topbar{display:flex;align-items:center;gap:8px;min-height:44px}
.topbar h1{flex:1;font:400 24px/1.05 var(--display);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar h1 small{display:block;font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-top:2px}
.back{width:44px;height:44px;flex:none;border:2.5px solid var(--edge);border-radius:12px 10px 13px 9px;background:var(--paper-2);font-size:22px;box-shadow:0 3px 0 var(--edge)}
.back.ph{visibility:hidden}
.cur-row{display:flex;gap:6px;flex:none}
.cur{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--edge);border-radius:9px 8px 10px 8px;padding:2px 7px;background:var(--paper-2);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.ic{display:inline-block;width:12px;height:12px;border:2px solid var(--edge);flex:none}
.ic-gold{background:var(--butter);border-radius:50%}
.ic-ink{background:var(--lav);transform:rotate(45deg) scale(.85);border-radius:2px}
.ic-shard{background:var(--sky);clip-path:polygon(50% 0,100% 40%,80% 100%,20% 100%,0 40%);border:none}

.btn{min-height:46px;padding:8px 14px;font:700 14px var(--body);background:var(--paper-2);border:2.5px solid var(--edge);border-radius:11px 9px 12px 10px;box-shadow:0 3px 0 var(--edge);color:var(--ink)}
.btn.primary{background:var(--teal);color:var(--tile-ink)}
.btn.danger{background:var(--coral);color:var(--tile-ink)}
.btn.big{min-height:54px;font-size:16px}
.btn:not(:disabled):active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.btn:disabled{opacity:.5}
.acts{display:flex;gap:8px;justify-content:space-between}
.acts.col{flex-direction:column}
.acts.wrap{flex-wrap:wrap;justify-content:flex-start}
.badge{display:inline-block;font:700 11px var(--body);padding:1px 8px;border:2px solid var(--edge);border-radius:7px;background:var(--butter);color:var(--tile-ink);letter-spacing:.04em;vertical-align:middle}
.badge.boss{background:var(--coral)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{min-height:40px;padding:6px 12px;border:2.5px solid var(--edge);border-radius:10px 9px 11px 8px;background:var(--paper-2);font-weight:700;font-size:14px}
.tab.on{background:var(--butter);color:var(--tile-ink)}

/* Beranda */
.hub{display:flex;flex-direction:column;gap:14px}
.hero{display:flex;align-items:center;gap:12px;border:3px solid var(--edge);border-radius:18px 14px 20px 13px;background:linear-gradient(#BFE5F5,#FFF0CF);padding:10px 14px;box-shadow:0 4px 0 var(--shadow);color:#3B2F2F}
.herofig{flex:none;width:130px}
.herotxt p{margin:2px 0}
.herotxt .soft{color:#5A4A44}
.navgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.nav{min-height:56px;font-size:15px}
.dot-new{display:inline-block;font-size:10px;background:var(--coral);color:var(--tile-ink);border-radius:6px;padding:0 6px;margin-left:4px;vertical-align:middle}

/* Peta */
.maplist{display:flex;flex-direction:column;gap:14px}
.chap{border:3px solid var(--edge);border-radius:16px 13px 17px 12px;overflow:hidden;background:var(--paper);box-shadow:0 4px 0 var(--shadow)}
.chap.locked{opacity:.65}
.thumb{height:92px;position:relative;border-bottom:3px solid var(--edge)}
.thumb svg{position:absolute;inset:0;width:100%;height:100%}
.cbody{padding:10px 12px 12px}
.chead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chead h3{font:400 21px/1.1 var(--display);text-transform:none;letter-spacing:0;color:var(--ink);margin:0}
.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.stagebtn{min-height:52px;border:2.5px solid var(--edge);border-radius:10px 9px 11px 8px;background:var(--paper-2);box-shadow:0 3px 0 var(--edge);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.stagebtn small{font-weight:400;font-size:11px;color:var(--ink-soft)}
.stagebtn.cleared{background:var(--teal);color:var(--tile-ink)}
.stagebtn.cleared small{color:var(--tile-ink)}
.stagebtn.locked{opacity:.5;box-shadow:none}
.stagebtn:not(:disabled):active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.stageview{display:flex;flex-direction:column;gap:10px}
.enemies{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.enemy{display:flex;gap:10px;align-items:center;border:2.5px solid var(--edge);border-radius:12px 10px 13px 9px;background:var(--paper);padding:8px 10px}
.efig{flex:none;width:84px;min-height:70px;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(#BFE5F5,#FFF0CF);border-radius:9px;border:2px solid var(--edge);overflow:hidden;padding-top:6px}
.enemy b{font-size:15px}

/* Cerita */
.storyview{display:flex;flex-direction:column;gap:12px}
.storyarena{position:relative;border:3px solid var(--edge);border-radius:18px 14px 20px 13px;overflow:hidden;aspect-ratio:400/240;box-shadow:0 4px 0 var(--shadow)}
.storyarena svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.dialog{border:3px solid var(--edge);border-radius:16px 13px 17px 12px;background:var(--paper);padding:26px 14px 12px;position:relative;min-height:170px;box-shadow:0 4px 0 var(--shadow);display:flex;flex-direction:column;gap:8px}
.dialog p{font-size:16.5px;line-height:1.5;margin:0;flex:1}
.speaker{position:absolute;top:-16px;left:14px;padding:3px 14px;border:2.5px solid var(--edge);border-radius:10px 9px 11px 8px;font:400 19px var(--display);color:#3B2F2F}

/* Arena */
.arena{position:relative;border:3px solid var(--edge);border-radius:18px 14px 20px 13px;overflow:hidden;aspect-ratio:400/240;background:#BFE5F5;box-shadow:0 4px 0 var(--shadow)}
.arena svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.arena::after{content:"";position:absolute;inset:0;background:var(--coral);opacity:0;pointer-events:none}
.arena.hurt::after{animation:flash .45s ease-out}
.hud{position:absolute;top:8px;width:45%;background:var(--hud);border:2.5px solid var(--edge);border-radius:12px 9px 12px 10px;padding:4px 8px 6px;font-family:var(--display)}
.hud-l{left:8px}.hud-r{right:8px}
.hrow{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:15px;line-height:1.2;margin-bottom:3px;font-variant-numeric:tabular-nums}
.hrow span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow span:last-child{color:var(--ink-soft);font-size:13px;font-family:var(--body);font-weight:700}
.bar{height:11px;border:2px solid var(--edge);border-radius:7px 8px 6px 8px;background:var(--bar-bg);overflow:hidden}
.bar i{display:block;height:100%;width:100%}
.bar.hp i{background:var(--moss);transition:width .25s}
.bar.mhp i{background:var(--coral);transition:width .25s}
.bar.gauge{height:7px;margin-top:4px;border-width:1.5px}
.bar.gauge i{background:var(--lav)}
.hud .weak{font:700 11px var(--body);color:var(--ink-soft);margin-top:3px;display:block;min-height:1em}
.floats{position:absolute;inset:0;pointer-events:none}
.float{position:absolute;font:400 34px var(--display);color:#fff;-webkit-text-stroke:5px var(--line);paint-order:stroke fill;animation:rise .95s ease-out forwards;transform:translateX(-50%)}
.float.small{font-size:26px;color:var(--butter)}
.battlebar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hitline{margin:0;flex:1;min-height:2.7em;font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.chip{font:400 17px var(--display);border:2.5px solid var(--edge);border-radius:12px 9px 12px 10px;padding:3px 12px;background:var(--butter);color:var(--tile-ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.weapons{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.weapon{text-align:left;display:flex;flex-direction:column;gap:2px;padding:8px 9px 9px;min-height:48px;background:var(--paper-2);border:2.5px solid var(--edge);border-radius:12px 10px 13px 9px;box-shadow:0 3px 0 var(--edge);transition:transform .08s,box-shadow .08s}
.weapon.selected{outline:3px solid var(--butter);outline-offset:1px}
.weapon:not(:disabled):active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.weapon:disabled{opacity:.5;box-shadow:0 1px 0 var(--edge);transform:translateY(2px)}
.rar{align-self:flex-start;font:700 10px var(--body);letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:6px;border:1.5px solid var(--edge);color:var(--tile-ink);display:inline-block}
.r-0{background:var(--moss)}.r-1{background:var(--sky)}.r-2{background:var(--lav)}.r-3{background:var(--coral)}.r-4{background:var(--butter)}.r-5{background:var(--pink)}
.wname{font:700 14px/1.15 var(--body);margin-top:3px}
.wmeta{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.wtype{font-size:12px;font-weight:700;margin-top:2px;align-self:flex-start;padding:0 6px;border-radius:6px}
.wtype.weak{background:var(--butter);color:var(--tile-ink)}
.panel{border:3px solid var(--edge);border-radius:16px 13px 17px 12px;background:var(--paper);padding:14px;min-height:280px;box-shadow:0 4px 0 var(--shadow)}
.panel h2{margin:0 0 6px}
.panel.faded .prompt{opacity:.08;transition:opacity 1.2s}
.tips{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:6px;color:var(--ink-soft);font-size:14px}
.tips li{padding-left:18px;position:relative}
.tips li::before{content:"";position:absolute;left:2px;top:.5em;width:8px;height:8px;border-radius:50%;background:var(--butter);border:2px solid var(--edge)}
.mech{background:var(--paper-2);border:2px solid var(--edge);border-radius:10px 8px 11px 9px;padding:6px 10px;font-size:13.5px}
.note{background:var(--butter);color:var(--tile-ink);border:2px solid var(--edge);border-radius:8px;padding:2px 10px;font-weight:700;font-size:12.5px;margin-bottom:8px;display:inline-block}

/* Teka-teki */
.phead{display:flex;justify-content:space-between;align-items:baseline;font:400 19px var(--display);margin-bottom:6px}
.phead span:last-child{color:var(--ink-soft);font-size:16px}
.trow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.timer{flex:1;height:18px;border:2.5px solid var(--edge);border-radius:10px 9px 10px 8px;background:var(--bar-bg);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--teal)}
.timer i.warn{background:var(--butter)}.timer i.danger{background:var(--coral)}
.tnum{font:700 16px var(--body);width:3.6em;text-align:right;font-variant-numeric:tabular-nums}
.ask{color:var(--ink-soft);font-size:14px;margin:0 0 8px}
.ask em{font-style:normal;font-weight:700;color:var(--ink)}
.slots,.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-bottom:12px}
.slot{min-width:44px;height:52px;border:2.5px dashed var(--edge);border-radius:10px 12px 9px 11px;background:transparent;color:var(--ink);font:700 24px var(--body);padding:0 4px}
.slot.filled{border-style:solid;background:var(--paper-2)}
.slot.ok{background:var(--teal);color:var(--tile-ink);border-style:solid}
.slot.locked{border-style:solid;background:var(--paper-2);opacity:.8}
.slot.word,.tile.word{font-size:17px;padding:0 10px;min-width:48px}
.tile{min-width:44px;height:52px;padding:0 4px;background:var(--butter);color:var(--tile-ink);border:2.5px solid var(--edge);border-radius:10px 12px 9px 11px;box-shadow:0 3px 0 var(--edge);font:700 24px var(--body)}
.sm .slot,.sm .tile{min-width:36px;height:46px;font-size:20px}
.sm .slot.word,.sm .tile.word{font-size:16px;min-width:40px}
.tile:not(:disabled):active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.tile:disabled{visibility:hidden}
.bigword{font:400 40px/1.1 var(--display);text-align:center;margin:2px 0 12px;letter-spacing:.03em;overflow-wrap:anywhere}
.bigword.idiom{font-size:29px}
.bigword mark{background:var(--butter);color:var(--tile-ink);border-radius:6px;padding:0 4px}
.sentence{font:700 19px/1.5 var(--body);text-align:center;margin:0 0 12px}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--edge);margin:0 3px;text-align:center}
.blank.filled{border-color:var(--teal);font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.opt{min-height:52px;padding:8px 10px;font:700 16px var(--body);background:var(--paper-2);border:2.5px solid var(--edge);border-radius:11px 9px 12px 10px;box-shadow:0 3px 0 var(--edge);color:var(--ink);overflow-wrap:anywhere}
.opt:not(:disabled):active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.opt.off{opacity:.5;text-decoration:line-through;box-shadow:none;transform:translateY(2px);background:var(--coral);color:var(--tile-ink)}
.opt.ok{background:var(--teal);color:var(--tile-ink)}
.shake{animation:shake .35s}

/* Karakter, toko, kodeks, pengaturan */
.creator{display:flex;flex-direction:column;gap:10px}
.cpreview{display:flex;justify-content:center;border:3px solid var(--edge);border-radius:16px 13px 17px 12px;background:linear-gradient(#BFE5F5,#FFF0CF);padding:14px 0 8px;box-shadow:0 4px 0 var(--shadow);min-height:200px;align-items:flex-end}
.cbodyc{display:flex;flex-direction:column}
.itemgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.item{min-height:48px;padding:6px 8px;border:2.5px solid var(--edge);border-radius:10px 9px 11px 8px;background:var(--paper-2);box-shadow:0 3px 0 var(--edge);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:13.5px;text-align:center}
.item small{font-weight:400;font-size:11.5px;color:var(--ink-soft)}
.item.on{background:var(--butter);color:var(--tile-ink)}
.item.on small{color:var(--tile-ink)}
.item.locked{opacity:.85;border-style:dashed}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--edge)}
.sw.on{outline:3px solid var(--ink);outline-offset:2px}
input[type=range]{width:100%;height:36px;accent-color:var(--teal)}
.shoplist{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.wcard{display:flex;gap:10px;border:2.5px solid var(--edge);border-radius:14px 11px 15px 10px;background:var(--paper);padding:10px 12px;box-shadow:0 3px 0 var(--shadow)}
.wicon{flex:none;width:44px;display:flex;align-items:center;justify-content:center}
.wtext{flex:1;min-width:0}
.wtext h3{font:700 15px var(--body);letter-spacing:0;text-transform:none;color:var(--ink);margin:0 0 2px}
.wtext p{margin:0 0 4px}
.stat{font-size:12.5px;font-variant-numeric:tabular-nums}
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.counts div{border:2.5px solid var(--edge);border-radius:10px 9px 11px 8px;background:var(--paper-2);padding:8px;text-align:center}
.counts b{display:block;font:400 28px var(--display)}
.counts span{font-size:12px;color:var(--ink-soft)}
.cwlist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.cw{display:flex;justify-content:space-between;align-items:center;gap:8px;border:2px solid var(--edge);border-radius:10px 8px 11px 9px;background:var(--paper);padding:6px 10px;font-size:14px}
.state{flex:none;font-size:11px;font-weight:700;padding:2px 8px;border-radius:7px;border:2px solid var(--edge);color:var(--tile-ink)}
.s-fresh{background:var(--sky)}.s-learning{background:var(--butter)}.s-mastered{background:var(--moss)}
.empty{color:var(--ink-soft);text-align:center;padding:24px 8px}
.toggle-row{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:52px;padding:8px 12px;border:2.5px solid var(--edge);border-radius:11px 9px 12px 10px;background:var(--paper-2);font-weight:700;margin-bottom:8px}
.switch{width:46px;height:26px;border:2.5px solid var(--edge);border-radius:14px;background:var(--bar-bg);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--edge);transition:transform .15s}
.switch.on{background:var(--teal)}
.switch.on::after{transform:translateX(20px);background:var(--tile-ink)}
.settings,.riftintro,.endview{display:flex;flex-direction:column;gap:2px}
.endview{gap:10px;padding-top:12px}

/* Modal, toast */
.overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(20,14,24,.62);
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.overlay[hidden]{display:none}
.card{width:100%;max-width:420px;max-height:100%;overflow:auto;background:var(--paper);border:3px solid var(--edge);border-radius:18px 14px 20px 13px;padding:18px;box-shadow:0 5px 0 var(--shadow)}
.card h2{margin-bottom:8px}
.card .acts{margin-top:14px}
.rewards,.missed{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rewards li,.missed li{background:var(--paper-2);border:2px solid var(--edge);border-radius:9px 8px 10px 8px;padding:6px 10px;font-size:14px}
.toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:max(18px,env(safe-area-inset-bottom,0px));background:var(--edge);color:var(--paper);padding:8px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Animasi */
.bob{animation:bob 2.2s ease-in-out infinite}
.bob2{animation:bob 1.8s ease-in-out infinite;animation-delay:-.6s}
.fx{transform-box:fill-box;transform-origin:50% 100%}
.lunge{animation:lunge .5s ease-in-out}
.mshake{animation:mshake .4s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes lunge{0%{transform:translateX(0)}40%{transform:translateX(120px)}100%{transform:translateX(0)}}
@keyframes mshake{0%,100%{transform:translateX(0)}20%{transform:translateX(8px)}40%{transform:translateX(-7px)}60%{transform:translateX(5px)}80%{transform:translateX(-3px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes flash{0%{opacity:.35}100%{opacity:0}}
@keyframes rise{0%{opacity:0;margin-top:0}12%{opacity:1}100%{opacity:0;margin-top:-52px}}

/* ---- Animasi pertarungan: karakter, senjata, monster ---- */
.pwep{transform-box:view-box;transform-origin:0 0}
.float.big{font-size:46px;color:var(--butter)}
/* menunggu: karakter condong ke belakang, senjata berdenyut */
.charging{animation:lean 1s ease-in-out infinite}
.charging .pwep{animation:wglow .7s ease-in-out infinite}
@keyframes lean{0%,100%{transform:translateX(0) rotate(0)}50%{transform:translateX(-5px) rotate(-3deg)}}
@keyframes wglow{0%,100%{transform:rotate(-6deg) scale(1)}50%{transform:rotate(8deg) scale(1.08)}}
/* langkah + serang jarak dekat (quill, dagger, hammer) */
.atk-melee{animation:amelee .72s cubic-bezier(.4,0,.3,1)}
.atk-stab{animation:astab .55s cubic-bezier(.4,0,.3,1)}
.atk-slam{animation:aslam .85s cubic-bezier(.4,0,.3,1)}
@keyframes amelee{0%{transform:translate(0,0) rotate(0)}12%{transform:translate(-10px,0) rotate(-5deg)}22%{transform:translate(40px,-14px) rotate(2deg)}34%{transform:translate(80px,0) rotate(3deg)}44%{transform:translate(120px,-14px) rotate(5deg)}54%{transform:translate(150px,0) rotate(7deg)}66%{transform:translate(150px,0) rotate(4deg)}100%{transform:translate(0,0) rotate(0)}}
@keyframes astab{0%{transform:translate(0,0)}15%{transform:translate(-12px,0) rotate(-4deg)}40%{transform:translate(165px,-4px) rotate(6deg)}55%{transform:translate(165px,-4px) rotate(6deg)}100%{transform:translate(0,0) rotate(0)}}
@keyframes aslam{0%{transform:translate(0,0)}16%{transform:translate(-10px,-6px) rotate(-6deg)}34%{transform:translate(70px,-34px) rotate(0)}52%{transform:translate(150px,-12px) rotate(8deg)}60%{transform:translate(150px,4px) scale(1.04,.94) rotate(10deg)}74%{transform:translate(150px,0) rotate(5deg)}100%{transform:translate(0,0) rotate(0)}}
.swing{animation:wswing .72s ease-in-out}
.jab{animation:wjab .55s ease-in-out}
.smash{animation:wsmash .85s ease-in-out}
@keyframes wswing{0%{transform:rotate(0)}12%{transform:rotate(-55deg)}54%{transform:rotate(85deg)}100%{transform:rotate(0)}}
@keyframes wjab{0%{transform:rotate(0)}15%{transform:rotate(-30deg)}40%{transform:rotate(55deg) translate(0,-8px)}100%{transform:rotate(0)}}
@keyframes wsmash{0%{transform:rotate(0)}34%{transform:rotate(-125deg)}60%{transform:rotate(55deg)}74%{transform:rotate(50deg)}100%{transform:rotate(0)}}
/* sihir dan panah (staff, tome, bow) */
.atk-cast{animation:acast .7s ease-in-out}
@keyframes acast{0%{transform:translate(0,0) rotate(0)}30%{transform:translate(-12px,-6px) rotate(-6deg)}50%{transform:translate(10px,0) rotate(5deg)}100%{transform:translate(0,0) rotate(0)}}
.cast{animation:wcast .7s ease-in-out}
.draw{animation:wdraw .7s ease-in-out}
.read{animation:wread .8s ease-in-out}
@keyframes wcast{0%{transform:rotate(0)}30%{transform:rotate(-38deg) scale(1.1)}50%{transform:rotate(18deg) scale(1.15)}100%{transform:rotate(0) scale(1)}}
@keyframes wdraw{0%{transform:translate(0,0)}35%{transform:translate(-9px,0) scale(1.08)}50%{transform:translate(4px,0)}100%{transform:translate(0,0)}}
@keyframes wread{0%{transform:translate(0,0) rotate(0)}30%{transform:translate(4px,-14px) rotate(-12deg) scale(1.12)}70%{transform:translate(4px,-14px) rotate(-12deg) scale(1.12)}100%{transform:translate(0,0)}}
/* efek di lapisan #fx */
.proj{animation:pfly .42s ease-in forwards}
.projl{font:400 22px var(--display);fill:#fff;stroke:var(--line);stroke-width:4px;paint-order:stroke fill;animation:pfly .5s ease-in forwards;opacity:0}
.arrow{animation:pfly .32s linear forwards}
@keyframes pfly{0%{transform:translate(0,0) scale(.6);opacity:0}10%{opacity:1}100%{transform:translate(var(--dx,180px),var(--dy,0)) scale(1);opacity:1}}
.spk{animation:spk .5s ease-out forwards;transform-box:view-box;transform-origin:0 0}
@keyframes spk{0%{transform:translateY(-6px) scaleY(.3);opacity:1}100%{transform:translateY(-18px) scaleY(1.2);opacity:0}}
.ring{animation:ring .55s ease-out forwards;transform-box:fill-box;transform-origin:50% 50%}
@keyframes ring{0%{transform:scale(.2);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.slash{animation:slash .35s ease-out forwards}
@keyframes slash{0%{stroke-dashoffset:60;opacity:1}70%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.gshield{animation:gpop .6s ease-out forwards;transform-box:fill-box;transform-origin:50% 50%}
@keyframes gpop{0%{transform:scale(.5);opacity:0}25%{opacity:.9}100%{transform:scale(1.15);opacity:0}}
.conf{animation:conf 1.6s ease-in forwards;transform-box:fill-box;transform-origin:50% 50%}
@keyframes conf{0%{transform:translate(0,-30px) rotate(0);opacity:0}10%{opacity:1}100%{transform:translate(var(--cx,0px),270px) rotate(var(--cr,360deg));opacity:1}}
.sparkle{animation:sparkle .9s ease-out forwards;transform-box:fill-box;transform-origin:50% 50%}
@keyframes sparkle{0%{transform:scale(0) rotate(0);opacity:1}60%{transform:scale(1.2) rotate(90deg);opacity:1}100%{transform:scale(0) rotate(180deg);opacity:0}}
/* monster diserang */
.mhit{animation:mhit .45s ease-out}
.mhit-big{animation:mhitbig .6s ease-out}
@keyframes mhit{0%{transform:translate(0,0)}15%{transform:translate(16px,0) scale(.92,1.08);filter:brightness(1.7) saturate(.6)}40%{transform:translate(-6px,0) scale(1.05,.95)}100%{transform:translate(0,0);filter:none}}
@keyframes mhitbig{0%{transform:translate(0,0)}12%{transform:translate(30px,-6px) scale(.86,1.14) rotate(8deg);filter:brightness(2) saturate(.4)}38%{transform:translate(-10px,0) scale(1.08,.92) rotate(-4deg)}65%{transform:translate(6px,0)}100%{transform:translate(0,0);filter:none}}
/* monster menyerang, gerak sesuai jenis */
.matk-blob{animation:mblob .8s cubic-bezier(.4,0,.3,1)}
.matk-goblin{animation:mgob .65s cubic-bezier(.4,0,.3,1)}
.matk-bird{animation:mbird .8s ease-in-out}
.matk-ghost{animation:mghost .9s ease-in-out}

['Ambil Quill Blade ini. Setiap serangan harus dibuka dengan kata yang tepat. Susun huruf yang berantakan, dan pedangmu akan bersinar.','Take this Quill Blade. Every attack must be unlocked with the right word. Unscramble the jumbled letters and your sword will shine.','Toma esta Quill Blade. Cada ataque debe desbloquearse con la palabra correcta. Ordena las letras revueltas y tu espada brillará.','Prends cette Quill Blade. Chaque attaque doit être déverrouillée par le bon mot. Remets les lettres en ordre et ton épée brillera.','拿着这把羽毛笔之刃。每次攻击都必须用正确的单词解锁。把打乱的字母排好,你的剑就会发光。','このクイルブレードを持って。攻撃はすべて正しいことばで解き放つの。ばらばらの文字を並べかえれば、剣が輝くわ。','이 깃펜 검을 받아요. 모든 공격은 알맞은 단어로 열어야 해요. 흩어진 글자를 맞추면 검이 빛날 거예요.','รับ Quill Blade เล่มนี้ไป ทุกการโจมตีต้องปลดล็อกด้วยคำที่ถูกต้อง เรียงตัวอักษรที่ยุ่งเหยิงให้ถูก แล้วดาบของคุณจะเปล่งประกาย'],
['Typo Titan roboh! Desa kembali ramai, dan papan-papan namanya bisa dibaca lagi.','The Typo Titan has fallen! The village is lively again, and the signs can be read once more.','¡El Typo Titan ha caído! La aldea vuelve a estar animada y los carteles se pueden leer otra vez.','Le Typo Titan est tombé ! Le village revit, et les enseignes sont de nouveau lisibles.','Typo Titan 倒下了!村子重新热闹起来,招牌也能再次读懂。','タイポ・タイタンがたおれた!村にぎわいがもどり、看板もまた読めるようになったわ。','타이포 타이탄이 쓰러졌어요! 마을이 다시 활기를 되찾았고, 간판도 다시 읽을 수 있어요.','Typo Titan ล้มแล้ว! หมู่บ้านกลับมาคึกคัก และป้ายต่าง ๆ ก็อ่านได้อีกครั้ง'],
['Tapi Gloom makin kuat di Whispering Woods. Terimalah Jubah Magang ini, dan berhati-hatilah.','But the Gloom is growing stronger in the Whispering Woods. Take this Apprentice Robe, and be careful.','Pero el Gloom se hace más fuerte en Whispering Woods. Acepta esta túnica de aprendiz y ten cuidado.','Mais le Gloom se renforce dans Whispering Woods. Prends cette robe d\'apprenti et sois prudent.','但 Gloom 在低语森林中越来越强。收下这件学徒长袍,务必小心。','でもささやきの森ではグルームが強まっているわ。この見習いのローブを受け取って、気をつけてね。','하지만 속삭임의 숲에서는 글룸이 더 강해지고 있어요. 이 견습생 로브를 받고 조심하세요.','แต่ Gloom ในป่ากระซิบแข็งแกร่งขึ้นเรื่อย ๆ รับเสื้อคลุมฝึกหัดตัวนี้ไป และระวังตัวด้วย'],
['Pssst, Wordbearer. Kalau butuh senjata atau baju baru, toko Pip selalu buka!','Psst, Wordbearer. If you need a new weapon or outfit, Pip\'s shop is always open!','Pssst, Wordbearer. Si necesitas un arma o ropa nueva, ¡la tienda de Pip siempre está abierta!','Psst, Wordbearer. Si tu as besoin d\'une arme ou d\'une tenue, la boutique de Pip est toujours ouverte !','嘘,Wordbearer。需要新武器或新衣服的话,皮普的商店随时营业!','しーっ、ワードベアラー。新しい武器や服がほしいなら、ピップの店はいつでも開いてるよ!','쉿, 워드베어러. 새 무기나 옷이 필요하면 핍의 상점은 언제나 열려 있어!','จุ๊ ๆ Wordbearer ถ้าอยากได้อาวุธหรือชุดใหม่ ร้านของพิปเปิดเสมอนะ!'],
['Pohon-pohon di hutan ini berbisik kalimat yang salah. Waktu seperti tertukar: kemarin, sekarang, dan besok bercampur.','The trees in this forest whisper wrong sentences. Time seems tangled: yesterday, today and tomorrow are mixed together.','Los árboles de este bosque susurran oraciones incorrectas. El tiempo parece revuelto: ayer, hoy y mañana se mezclan.','Les arbres de cette forêt murmurent des phrases fausses. Le temps semble brouillé : hier, aujourd\'hui et demain se mélangent.','这片森林里的树木在低语错误的句子。时间仿佛被打乱:昨天、今天和明天混在了一起。','この森の木々はまちがった文をささやいている。時間も入りまじり、きのう・きょう・あしたがごちゃまぜだ。','이 숲의 나무들은 틀린 문장을 속삭입니다. 시간이 뒤엉킨 듯, 어제와 오늘과 내일이 뒤섞여 있습니다.','ต้นไม้ในป่านี้กระซิบประโยคที่ผิด เวลาเหมือนปนกัน เมื่อวาน วันนี้ และพรุ่งนี้ผสมรวมกัน'],
['Berhenti di situ. Aku Kael, Wordbearer dari Menara Utara. Kitab kuno di hutan ini milikku.','Stop right there. I\'m Kael, a Wordbearer from the Northern Tower. The ancient book in this forest is mine.','Alto ahí. Soy Kael, Wordbearer de la Torre del Norte. El libro antiguo de este bosque es mío.','Halte-là. Je suis Kael, Wordbearer de la Tour du Nord. Le livre ancien de cette forêt est à moi.','站住。我是凯尔,来自北塔的 Wordbearer。这座森林里的古籍是我的。','そこで止まれ。おれはケイル、北の塔のワードベアラーだ。この森の古い書物はおれのものだ。','거기 서. 나는 북쪽 탑의 워드베어러 카엘이다. 이 숲의 고서는 내 것이야.','หยุดตรงนั้น ฉันคือเคียล Wordbearer จากหอคอยเหนือ คัมภีร์โบราณในป่านี้เป็นของฉัน'],
['Kael, kita ada di pihak yang sama!','Kael, we\'re on the same side!','¡Kael, estamos del mismo lado!','Kael, nous sommes du même côté !','凯尔,我们是同一阵营的!','ケイル、わたしたちは味方よ!','카엘, 우리는 같은 편이에요!','เคียล เราอยู่ฝ่ายเดียวกันนะ!'],
['Kita lihat saja siapa yang lebih cepat berpikir.','Let\'s see who thinks faster.','Veamos quién piensa más rápido.','On verra bien qui réfléchit le plus vite.','我们就看看谁想得更快吧。','だれが先に頭を働かせられるか、見せてもらおう。','누가 더 빨리 생각하는지 두고 보자.','มาดูกันว่าใครคิดเร็วกว่ากัน'],
['Tense Wraith lenyap bersama kabut. Waktu kembali berjalan lurus.','The Tense Wraith vanishes with the mist. Time flows straight again.','El Tense Wraith se desvanece con la niebla. El tiempo vuelve a fluir en línea recta.','Le Tense Wraith disparaît dans la brume. Le temps reprend son cours normal.','Tense Wraith 随着迷雾消散。时间重新恢复了正常流动。','テンス・レイスは霧とともに消えた。時間はまっすぐに流れはじめた。','텐스 레이스가 안개와 함께 사라졌습니다. 시간이 다시 곧게 흐릅니다.','Tense Wraith จางหายไปพร้อมกับหมอก เวลากลับมาไหลตรงอีกครั้ง'],
['Tidak buruk. Tapi Tome kuno ini aku bawa. Kalian belum siap memegangnya.','Not bad. But I\'m taking this ancient Tome. You\'re not ready to hold it.','Nada mal. Pero me llevo este Tome antiguo. Aún no estáis listos para sostenerlo.','Pas mal. Mais j\'emporte ce Tome ancien. Vous n\'êtes pas prêts à le tenir.','不错嘛。不过这本古老的 Tome 我带走了。你们还没有资格拿着它。','悪くない。だがこの古いトームはおれがもらっていく。おまえたちにはまだ早い。','나쁘지 않군. 하지만 이 오래된 서는 내가 가져가겠어. 너희는 아직 들 준비가 안 됐어.','ไม่เลว แต่ฉันจะเอาเล่ม Tome โบราณนี้ไป พวกเธอยังไม่พร้อมจะถือมัน'],
['Dia membawa Tome of the First Tongue... Kita harus mengejarnya ke Synonym Citadel.','He\'s carrying the Tome of the First Tongue... We have to chase him to the Synonym Citadel.','Lleva el Tome of the First Tongue... Tenemos que perseguirlo hasta Synonym Citadel.','Il emporte le Tome of the First Tongue... Nous devons le poursuivre jusqu\'à Synonym Citadel.','他带走了“第一语言之书”……我们必须追到同义词堡垒去。','あいつはファースト・タン・トームを持っていった……シノニム城塞まで追いかけなきゃ。','그가 첫 번째 언어의 서를 가져갔어요… 동의어 성채까지 쫓아가야 해요.','เขาเอา Tome of the First Tongue ไป... เราต้องตามไปที่ป้อมปราการคำพ้องความหมาย'],
['Citadel ini penuh kata yang artinya hampir sama. Satu kata salah, satu makna ikut tersesat.','This Citadel is full of words with nearly the same meaning. One wrong word, and a meaning gets lost.','Esta ciudadela está llena de palabras con significados casi iguales. Una palabra equivocada y un significado se pierde.','Cette citadelle regorge de mots au sens presque identique. Un mot faux, et un sens s\'égare.','这座堡垒里满是意思相近的词。错一个词,就会让一个含义迷路。','この城塞には、ほとんど同じ意味のことばがあふれている。ひとつまちがえれば、意味もまよってしまう。','이 성채에는 뜻이 거의 같은 단어가 가득해요. 단어 하나를 틀리면 뜻 하나가 길을 잃죠.','ป้อมปราการนี้เต็มไปด้วยคำที่ความหมายเกือบเหมือนกัน ผิดไปหนึ่งคำ ความหมายหนึ่งก็หลงทาง'],
['Pegang erat senjatamu. Ratu Gema di singgasana akan mengulang semua kesalahanmu.','Hold your weapon tight. The Echo Queen on her throne will repeat all your mistakes.','Agarra bien tu arma. La Reina del Eco en su trono repetirá todos tus errores.','Serre bien ton arme. La Reine Écho sur son trône répétera toutes tes erreurs.','握紧你的武器。王座上的回声女王会重复你所有的错误。','武器をしっかりにぎって。玉座のエコー・クイーンは、あなたのまちがいをすべてくり返すわ。','무기를 꽉 쥐세요. 왕좌의 에코 여왕이 당신의 모든 실수를 되풀이할 거예요.','จับอาวุธให้แน่น ราชินีเอคโค่บนบัลลังก์จะพูดซ้ำความผิดพลาดทั้งหมดของคุณ'],
['Dengarkan, Wordbearer. Gloom adalah kata-kata yang ditinggalkan. Setiap kata yang kamu lupakan menjadi makhluk baru.','Listen, Wordbearer. Gloom is made of abandoned words. Every word you forget becomes a new creature.','Escucha, Wordbearer. El Gloom está hecho de palabras abandonadas. Cada palabra que olvidas se convierte en una nueva criatura.','Écoute, Wordbearer. Le Gloom est fait de mots abandonnés. Chaque mot que tu oublies devient une nouvelle créature.','听着,Wordbearer。Gloom 是被抛弃的文字。你每忘掉一个词,就会诞生一只新怪物。','聞きなさい、ワードベアラー。グルームは見捨てられたことば。あなたがわすれたことばは、新たな怪物になるのです。','들으세요, 워드베어러. 글룸은 버려진 말로 이루어져 있어요. 당신이 잊은 단어마다 새로운 괴물이 됩니다.','ฟังไว้ Wordbearer Gloom คือถ้อยคำที่ถูกทอดทิ้ง ทุกคำที่คุณลืมจะกลายเป็นสิ่งมีชีวิตใหม่'],
['Lord Mute ingin menghapus semua kata supaya dunia tenang. Ia menunggu di Silent Court.','Lord Mute wants to erase every word so the world can be quiet. He waits in the Silent Court.','Lord Mute quiere borrar todas las palabras para que el mundo esté en calma. Te espera en la Silent Court.','Lord Mute veut effacer tous les mots pour que le monde soit calme. Il t\'attend dans la Silent Court.','Lord Mute 想抹去所有文字,让世界归于宁静。他在寂静宫廷等着你。','ロード・ミュートは世界を静かにするため、すべてのことばを消そうとしています。彼はサイレント・コートで待っています。','로드 뮤트는 세상을 고요하게 만들려고 모든 말을 지우려 해요. 그는 침묵의 궁정에서 기다리고 있어요.','Lord Mute ต้องการลบถ้อยคำทั้งหมดเพื่อให้โลกเงียบสงบ เขารออยู่ที่ Silent Court'],
['Jadi lawan terakhir kita adalah keheningan itu sendiri. Kita naik ke Idiom Peaks dulu.','So our final enemy is silence itself. First, we climb to the Idiom Peaks.','Así que nuestro enemigo final es el silencio mismo. Primero subiremos a Idiom Peaks.','Notre ennemi final est donc le silence lui-même. Montons d\'abord à Idiom Peaks.','所以我们最后的敌人就是寂静本身。先去成语峰吧。','つまり最後の敵は静けさそのもの。まずはイディオム峰にのぼりましょう。','그러니 우리의 마지막 적은 침묵 그 자체군요. 먼저 관용구 봉우리로 올라가요.','งั้นศัตรูคนสุดท้ายของเราก็คือความเงียบเอง เราไปที่ Idiom Peaks กันก่อน'],
['Salju turun di puncak. Di sini orang bicara dengan kiasan, dan arti harfiah menyesatkan.','Snow falls on the peaks. People here speak in figures of speech, and literal meanings mislead.','Cae nieve en las cumbres. Aquí la gente habla con figuras retóricas y el sentido literal engaña.','La neige tombe sur les sommets. Ici, on parle par images, et le sens littéral induit en erreur.','山顶下着雪。这里的人说话都用比喻,字面意思会误导你。','山頂に雪がふっている。ここの人々は比喩で話し、文字どおりの意味はあてにならない。','봉우리에 눈이 내립니다. 이곳 사람들은 비유로 말해서 글자 그대로의 뜻은 오히려 헷갈리게 해요.','หิมะตกบนยอดเขา ผู้คนที่นี่พูดด้วยสำนวนเปรียบเทียบ ความหมายตามตัวอักษรจึงหลอกเราได้'],
['Aku salah menilaimu. Boleh ikut? Aku tahu jalan ke Ogre yang menjaga celah ini.','I misjudged you. Can I come along? I know the way to the Ogre guarding this pass.','Te juzgué mal. ¿Puedo acompañarte? Conozco el camino hasta el Ogro que guarda este paso.','Je t\'ai mal jugé. Je peux venir ? Je connais le chemin jusqu\'à l\'Ogre qui garde ce col.','我看错你了。我能同行吗?我知道通往守着这个隘口的食人魔的路。','きみを見くびっていた。いっしょに行ってもいいか?この峠を守るオーガへの道なら知っている。','내가 너를 잘못 봤어. 같이 가도 될까? 이 고개를 지키는 오우거에게 가는 길을 알고 있어.','ฉันประเมินเธอผิดไป ขอไปด้วยได้ไหม ฉันรู้ทางไปหาออร์คที่เฝ้าช่องเขานี้'],
['Ogre itu terlalu literal. Kita berhasil.','That Ogre was far too literal. We did it.','Ese Ogro era demasiado literal. Lo logramos.','Cet Ogre était bien trop littéral. On a réussi.','那个食人魔太死板了。我们成功了。','あのオーガは文字どおりすぎたな。やったぞ。','그 오우거는 너무 곧이곧대로였어. 해냈다.','ออร์คตัวนั้นตีความตรงตัวเกินไป เราทำได้แล้ว'],
['Aduh... aku terpeleset waktu membawa perbekalan. Aku tidak apa-apa, jangan berhenti!','Ouch... I slipped while carrying the supplies. I\'m fine, don\'t stop!','Ay... me resbalé llevando las provisiones. Estoy bien, ¡no os detengáis!','Aïe... j\'ai glissé en portant les provisions. Ça va, ne vous arrêtez pas !','哎哟……我搬补给的时候滑倒了。我没事,别停下!','いたた……荷物をはこんでいて足をすべらせちゃった。だいじょうぶ、止まらないで!','아야… 보급품을 나르다 미끄러졌어. 난 괜찮아, 멈추지 마!','โอ๊ย... ฉันลื่นล้มตอนขนเสบียง ฉันไม่เป็นไร อย่าหยุดนะ!'],
['Silent Court sudah di depan mata. Kumpulkan keberanianmu.','The Silent Court is right ahead. Gather your courage.','La Silent Court está justo delante. Reúne tu valor.','La Silent Court est juste devant. Rassemble ton courage.','寂静宫廷就在眼前。鼓起你的勇气吧。','サイレント・コートはもう目の前。勇気をふりしぼって。','침묵의 궁정이 바로 눈앞이에요. 용기를 내세요.','Silent Court อยู่ตรงหน้าแล้ว รวบรวมความกล้าของคุณ'],
['Tidak ada suara di sini. Bahkan langkahmu tidak terdengar.','There is no sound here. Not even your footsteps can be heard.','Aquí no hay ningún sonido. Ni siquiera se oyen tus pasos.','Il n\'y a aucun bruit ici. Même tes pas ne s\'entendent pas.','这里没有任何声音。连你的脚步声都听不见。','ここには音がない。自分の足音さえ聞こえない。','이곳에는 아무 소리도 없습니다. 발소리조차 들리지 않습니다.','ที่นี่ไม่มีเสียงใด ๆ แม้แต่เสียงฝีเท้าของคุณก็ไม่ได้ยิน'],
['Kata-kata hanya membuat dunia gaduh. Biarkan semuanya diam.','Words only make the world noisy. Let everything be silent.','Las palabras solo hacen ruidoso el mundo. Que todo guarde silencio.','Les mots ne font que rendre le monde bruyant. Que tout se taise.','文字只会让世界变得嘈杂。让一切归于沉默吧。','ことばは世界をさわがしくするだけだ。すべてを静寂にしよう。','말은 세상을 시끄럽게 할 뿐이다. 모든 것을 침묵하게 두어라.','ถ้อยคำมีแต่ทำให้โลกวุ่นวาย ปล่อยให้ทุกอย่างเงียบเถิด'],
['Jangan dengarkan dia. Kita tulis kalimat kita sendiri.','Don\'t listen to him. We\'ll write our own sentences.','No lo escuches. Escribiremos nuestras propias frases.','Ne l\'écoute pas. Nous écrirons nos propres phrases.','别听他的。我们来写属于自己的句子。','聞くな。おれたちは自分たちの文を書く。','저 말에 귀 기울이지 마. 우리만의 문장을 쓰자.','อย่าไปฟังเขา เราจะเขียนประโยคของเราเอง'],
['Kalimatmu... masih ada gemanya. Aku... mengerti.','Your sentences... still echo. I... understand.','Tus frases... aún tienen eco. Yo... comprendo.','Tes phrases... résonnent encore. Je... comprends.','你的句子……仍有回响。我……明白了。','おまえの文は……まだ響いている。わたしは……わかった。','너의 문장은… 아직 울림이 남아 있군. 나는… 이해했다.','ประโยคของเจ้า... ยังมีเสียงสะท้อนอยู่ ข้า... เข้าใจแล้ว'],
['Kamu punya pilihan terakhir, Wordbearer: kembalikan semua kata, atau sisakan yang bermakna.','You have one final choice, Wordbearer: bring back every word, or keep only the meaningful ones.','Tienes una última elección, Wordbearer: devolver todas las palabras o conservar solo las que tienen sentido.','Tu as un dernier choix, Wordbearer : rendre tous les mots au monde, ou ne garder que ceux qui ont du sens.','你有最后一个选择,Wordbearer:让所有文字回归,或只保留有意义的那些。','最後の選択よ、ワードベアラー。すべてのことばを取りもどすか、意味のあることばだけを残すか。','마지막 선택이 남았어요, 워드베어러. 모든 말을 되돌리거나, 의미 있는 말만 남기거나.','คุณมีทางเลือกสุดท้าย Wordbearer: คืนถ้อยคำทั้งหมด หรือเก็บไว้เฉพาะคำที่มีความหมาย'],
['Semua kata kembali ke dunia. Pasar, sekolah, dan lagu-lagu ramai lagi, kadang kacau, tapi hidup. Wordbearer menjadi penjaga kosakata Verbum.','Every word returns to the world. Markets, schools and songs are lively again, sometimes chaotic, but alive. The Wordbearer becomes the guardian of Verbum\'s vocabulary.','Todas las palabras vuelven al mundo. Los mercados, las escuelas y las canciones vuelven a bullir, a veces caóticos, pero vivos. El Wordbearer se convierte en el guardián del vocabulario de Verbum.','Tous les mots reviennent au monde. Les marchés, les écoles et les chansons s\'animent de nouveau, parfois dans le chaos, mais bien vivants. Le Wordbearer devient le gardien du vocabulaire de Verbum.','所有文字回到了世界。集市、学校和歌曲再度热闹起来,有时混乱,却充满生机。Wordbearer 成为 Verbum 词汇的守护者。','すべてのことばが世界にもどった。市場も学校も歌もにぎやかになり、ときにはさわがしいけれど、生き生きとしている。ワードベアラーはヴェルブムのことばの守り手となった。','모든 말이 세상으로 돌아왔습니다. 시장과 학교와 노래가 다시 북적이고, 때로는 어지럽지만 생기가 넘칩니다. 워드베어러는 베르붐의 어휘를 지키는 수호자가 됩니다.','ถ้อยคำทั้งหมดกลับคืนสู่โลก ตลาด โรงเรียน และเสียงเพลงกลับมาคึกคัก บางครั้งวุ่นวายแต่มีชีวิตชีวา Wordbearer กลายเป็นผู้พิทักษ์คลังคำศัพท์แห่ง Verbum'],
['Hanya kata-kata yang bermakna yang dipertahankan. Dunia menjadi tenang dan seimbang. Wordbearer menulis kamus pertama Verbum.','Only meaningful words are kept. The world becomes calm and balanced. The Wordbearer writes Verbum\'s first dictionary.','Solo se conservan las palabras con sentido. El mundo se vuelve sereno y equilibrado. El Wordbearer escribe el primer diccionario de Verbum.','Seuls les mots qui ont du sens sont conservés. Le monde devient calme et équilibré. Le Wordbearer écrit le premier dictionnaire de Verbum.','只留下有意义的文字。世界变得宁静而平衡。Wordbearer 编写了 Verbum 的第一部词典。','意味のあることばだけが残された。世界は静かでバランスのとれたものになった。ワードベアラーはヴェルブム初の辞書を書いた。','의미 있는 말만 남았습니다. 세상은 고요하고 균형 잡혔습니다. 워드베어러는 베르붐 최초의 사전을 씁니다.','คงไว้เพียงถ้อยคำที่มีความหมาย โลกสงบและสมดุล Wordbearer เขียนพจนานุกรมเล่มแรกของ Verbum'],

['Semua soal berupa Susun kalimat. Jawaban salah pertama menumbuhkan kepala baru: monster memulihkan 4% HP.','All puzzles are Sentence order. Your first wrong answer grows a new head: the monster heals 4% HP.','Todos los acertijos son de ordenar frases. Tu primer error le hace crecer una cabeza nueva: el monstruo recupera un 4 % de PV.','Toutes les énigmes sont des phrases à remettre en ordre. Ta première erreur fait pousser une nouvelle tête : le monstre récupère 4 % de PV.','所有谜题都是句子排序。第一次答错会让它长出新头，怪物回复4%生命。','すべて文の並べ替え。最初の間違いで新しい首が生え、モンスターのHPが4%回復する。','모든 문제가 문장 배열이에요. 처음 틀리면 머리가 새로 자라 몬스터가 HP 4%를 회복해요.','ทุกข้อเป็นเรียงประโยค ตอบผิดครั้งแรกจะมีหัวใหม่งอก มอนสเตอร์ฟื้น HP 4%'],

['Teks soal memudar setelah 4 detik, dan jawaban salah pertama memulihkan 3% HP monster.','Puzzle text fades after 4 seconds, and your first wrong answer heals the monster for 3% HP.','El texto del acertijo se desvanece a los 4 segundos y tu primer error cura al monstruo un 3 % de PV.','Le texte s\'efface après 4 secondes, et ta première erreur rend 3 % de PV au monstre.','题目文字4秒后淡出，第一次答错会让怪物回复3%生命。','問題文は4秒で消え、最初の間違いでモンスターのHPが3%回復する。','문제 글씨가 4초 뒤에 흐려지고, 처음 틀리면 몬스터가 HP 3%를 회복해요.','ข้อความโจทย์จางหายหลัง 4 วินาที และตอบผิดครั้งแรกมอนสเตอร์ฟื้น HP 3%'],
['Bukan aku yang memulai keheningan ini. Ada sesuatu di bawah Verbum yang menelan kata-kata, jauh sebelum aku.','I did not start this silence. Something beneath Verbum has been swallowing words since long before me.','Yo no empecé este silencio. Algo bajo Verbum lleva tragándose las palabras desde mucho antes que yo.','Ce n\'est pas moi qui ai commencé ce silence. Quelque chose sous Verbum avale les mots bien avant moi.','这份寂静不是我造成的。早在我之前，维尔邦姆之下就有东西在吞噬文字。','この静寂は私が始めたのではない。私よりずっと前から、ヴェルブムの地下で何かが言葉を飲み込んでいる。','이 침묵은 내가 시작한 게 아니다. 나보다 훨씬 전부터 베르붐 아래의 무언가가 말을 삼키고 있었다.','ความเงียบนี้ไม่ได้เริ่มจากข้า มีบางสิ่งใต้เวอร์บุมกลืนกินถ้อยคำมานานก่อนข้าเสียอีก'],
['Jadi Gloom bukan sumber masalahnya. Kita turun ke rawa di bawah Court dan cari tahu.','So Gloom is not the source of the problem. Let\'s go down to the marsh beneath the Court and find out.','Así que Gloom no es el origen del problema. Bajemos al pantano bajo la Corte y averigüémoslo.','Donc Gloom n\'est pas la source du problème. Descendons dans le marais sous la Cour pour le découvrir.','原来根源不是Gloom。我们去宫廷下面的沼泽一探究竟。','つまりGloomは根本原因じゃない。宮廷の下の沼へ降りて確かめよう。','그러니까 Gloom이 원인이 아니었어. 법정 아래 늪으로 내려가 알아보자.','งั้น Gloom ไม่ใช่ต้นเหตุ ลงไปที่หนองน้ำใต้ศาลแล้วหาคำตอบกัน'],
['Di bawah Silent Court, lantai batu berubah menjadi rawa. Kata kerja dan kata depan saling menempel, lalu terlepas lagi tanpa aturan.','Beneath the Silent Court, the stone floor turns into a marsh. Verbs and prepositions stick together, then break apart again with no rules.','Bajo la Corte Silenciosa, el suelo de piedra se convierte en un pantano. Los verbos y las preposiciones se pegan y se separan sin reglas.','Sous la Cour silencieuse, le sol de pierre devient un marais. Les verbes et les prépositions se collent, puis se détachent sans aucune règle.','寂静宫廷之下，石地变成了沼泽。动词和介词黏在一起，又毫无规律地分开。','静寂の宮廷の下で、石の床が沼に変わる。動詞と前置詞はくっついたり離れたり、規則なんてない。','침묵의 법정 아래, 돌바닥이 늪으로 변했어요. 동사와 전치사가 붙었다 떨어지길 규칙 없이 반복해요.','ใต้ศาลแห่งความเงียบ พื้นหินกลายเป็นหนองน้ำ คำกริยากับคำบุพบทติดกันแล้วหลุดออกโดยไม่มีกฎใดๆ'],
['Look up, look after, look into... artinya beda semua! Satu partikel yang salah bisa mengubah seluruh maksud kalimat.','Look up, look after, look into... they all mean different things! One wrong particle can change the whole meaning.','Look up, look after, look into... ¡todas significan algo distinto! Una partícula equivocada cambia todo el sentido.','Look up, look after, look into... elles ont toutes un sens différent ! Une seule particule fausse change tout le sens.','look up、look after、look into……意思全都不同！一个小品词错了，整句话的意思就变了。','look up、look after、look into……全部意味が違う！小さな助詞ひとつで文の意味が変わるよ。','look up, look after, look into... 뜻이 다 달라요! 불변화사 하나만 틀려도 문장 전체의 뜻이 바뀌어요.','look up, look after, look into... ความหมายต่างกันหมด! คำเสริมผิดคำเดียวก็เปลี่ยนความหมายทั้งประโยค'],
['Lord Mute bilang ada yang menelan kata-kata. Jejaknya menuju rawa ini.','Lord Mute said something is swallowing words. Its trail leads to this marsh.','Lord Mute dijo que algo se traga las palabras. Su rastro lleva a este pantano.','Lord Mute a dit que quelque chose avale les mots. Sa piste mène à ce marais.','Lord Mute说有东西在吞噬文字，线索通向这片沼泽。','Lord Muteは何かが言葉を飲み込んでいると言った。その跡はこの沼へ続いている。','Lord Mute가 뭔가 말을 삼키고 있다고 했어. 그 흔적이 이 늪으로 이어져.','Lord Mute บอกว่ามีบางสิ่งกลืนกินถ้อยคำ ร่องรอยนำมาที่หนองน้ำนี้'],
['Phrasal Hydra tumbang. Kepala-kepalanya larut menjadi kabut, dan di dasar rawa terbuka tangga batu yang menurun.','The Phrasal Hydra falls. Its heads dissolve into mist, and a stone staircase opens at the bottom of the marsh.','La Hidra Frasal cae. Sus cabezas se disuelven en niebla y en el fondo del pantano se abre una escalera de piedra.','L\'Hydre à verbes à particule s\'effondre. Ses têtes se dissipent en brume, et un escalier de pierre s\'ouvre au fond du marais.','短语九头蛇倒下了。它的头化作迷雾，沼泽底部出现一道向下的石阶。','フレーザル・ヒドラが倒れた。首は霧となって消え、沼の底に石の階段が現れる。','구동사 히드라가 쓰러졌어요. 머리들이 안개로 흩어지고 늪 바닥에 돌계단이 열려요.','ไฮดราวลีกริยาล้มลง หัวทั้งหลายสลายเป็นหมอก และบันไดหินทอดลงไปที่ก้นหนองน้ำ'],
['Tangga ini menuju arsip tua yang pernah kubaca di Menara Utara: Archive of Roots.','This staircase leads to an old archive I once read about in the Northern Tower: the Archive of Roots.','Esta escalera lleva a un archivo antiguo del que leí en la Torre Norte: el Archivo de las Raíces.','Cet escalier mène à des archives anciennes dont j\'ai lu l\'existence dans la Tour du Nord : l\'Archive des Racines.','这条石阶通往我在北塔读到过的古老档案馆：词根档案馆。','この階段は北の塔で読んだ古い文書庫、語根の文書庫へ続いている。','이 계단은 북쪽 탑에서 읽은 적 있는 오래된 기록 보관소, 뿌리의 서고로 이어져.','บันไดนี้นำไปสู่หอจดหมายเหตุเก่าที่ข้าเคยอ่านในหอคอยเหนือ คือหอรากศัพท์'],
['Akar semua kata disimpan di sana. Kalau ada yang menelan kata, ia pasti mulai dari akarnya.','The roots of every word are kept there. If something is swallowing words, it must start with the roots.','Allí se guardan las raíces de todas las palabras. Si algo se traga las palabras, empezará por las raíces.','Les racines de tous les mots y sont conservées. Si quelque chose avale les mots, il commence par les racines.','所有词的词根都保存在那里。若有东西在吞噬文字，一定是从词根开始。','すべての言葉の語根がそこに保管されている。言葉を飲み込む者がいるなら、語根から始めるはず。','모든 단어의 뿌리가 거기 보관돼 있어요. 말을 삼키는 존재라면 뿌리부터 노렸을 거예요.','รากของทุกคำถูกเก็บไว้ที่นั่น ถ้ามีสิ่งใดกลืนกินคำ มันต้องเริ่มจากราก'],
['Rak-rak buku menjulang sampai ke kegelapan. Setiap kata tersusun dari awalan, akar, dan akhiran, dan semuanya tercecer.','Bookshelves tower up into the dark. Every word is built from a prefix, a root and a suffix, and all the pieces are scattered.','Las estanterías se alzan hasta la oscuridad. Cada palabra se forma con prefijo, raíz y sufijo, y todas las piezas están esparcidas.','Les étagères montent jusque dans l\'obscurité. Chaque mot est fait d\'un préfixe, d\'une racine et d\'un suffixe, et tout est éparpillé.','书架高耸入黑暗。每个词都由前缀、词根和后缀构成，而这些碎片散落一地。','本棚が闇の中までそびえ立つ。言葉は接頭辞・語根・接尾辞でできているのに、すべてが散らばっている。','책장이 어둠 속까지 솟아 있어요. 모든 단어는 접두사, 어근, 접미사로 이뤄지는데 조각이 다 흩어져 있어요.','ชั้นหนังสือสูงเสียดขึ้นไปในความมืด ทุกคำประกอบจากคำหน้า รากศัพท์ และคำหลัง แต่ชิ้นส่วนกระจัดกระจายไปหมด'],
['Un-, re-, dis-, pre-... Kalau kamu kenal potongannya, kata yang belum pernah kamu lihat pun bisa ditebak.','Un-, re-, dis-, pre-... If you know the pieces, you can guess words you have never seen.','Un-, re-, dis-, pre-... Si conoces las piezas, puedes adivinar palabras que nunca has visto.','Un-, re-, dis-, pre-... Si tu connais les morceaux, tu peux deviner des mots que tu n\'as jamais vus.','un-、re-、dis-、pre-……认识这些部件，就能猜出没见过的词。','un-、re-、dis-、pre-……部品を知っていれば、見たことのない単語も推測できるよ。','un-, re-, dis-, pre-... 조각을 알면 처음 보는 단어도 짐작할 수 있어요.','un-, re-, dis-, pre-... ถ้ารู้จักชิ้นส่วน ก็เดาคำที่ไม่เคยเห็นได้'],

/* cfg: {body,height(0-1),skin,hairStyle,hairColor,eye,outfit,dye,hat,face,neck,back} */
A.player=function(cfg,weaponId){
  cfg=cfg||{};
  var bw=bodyOf(cfg.body).w, tw=f(18*bw);
  var hs=f(0.92+(cfg.height==null?.5:cfg.height)*0.16);
  var skin=WB.SKINS[cfg.skin]||WB.SKINS[1], hair=WB.HAIR_COLORS[cfg.hairColor]||WB.HAIR_COLORS[0];
  var eye=WB.EYES[cfg.eye]||WB.EYES[0], dye=WB.DYES[cfg.dye]||WB.DYES[0];
  var o=cfg.outfit||'tunic', legC='#6B4A3A', handX=tw+6;
  var g='<g transform="scale('+hs+')">';
  g+='<ellipse cx="0" cy="2" rx="'+f(26*bw)+'" ry="5" fill="#3B2F2F" opacity=".18"/>';
  g+=backAcc(cfg.back,tw);
  g+=cloakArt(o,tw);
  g+=hairBack(cfg.hairStyle,hair);
  if(o!=='robe'){
    var lx=f(8*bw);
    g+=R(-lx-5*bw,-18,10*bw,18,legC,3)+R(lx-5*bw,-18,10*bw,18,legC,3)+R(-lx-6*bw,-5,12*bw,5,'#3B2F2F',2)+R(lx-6*bw,-5,12*bw,5,'#3B2F2F',2);
  }else{
    g+=R(-12*bw,-8,10*bw,8,'#3B2F2F',2)+R(2*bw,-8,10*bw,8,'#3B2F2F',2);
  }
  g+=outfitArt(o,dye,tw,bw);
  g+=frontBackAcc(cfg.back,tw);
  g+=neckAcc(cfg.neck,tw);
  g+=C(0,-80,19,skin);
  g+=dot(-7,-79,2.8,eye)+dot(7,-79,2.8,eye)+dot(-6,-80,.9,'#fff')+dot(8,-80,.9,'#fff');
  g+=dot(-12,-72,3.5,'#F27D72',.5)+dot(12,-72,3.5,'#F27D72',.5)+line('M-5 -71Q0 -67 5 -71');
  g+=faceAcc(cfg.face);
  g+=hairFront(cfg.hairStyle,hair);
  g+=hatArt(cfg.hat);
  if(weaponId){
    g+='<g transform="translate('+handX+' -46) rotate(22)"><g class="pwep">'+A.weapon(weaponId)+'</g></g>'+C(handX-2,-44,5.5,skin);
  }
  return g+'</g>';
};

<script>
/* Wordbound: logika game murni (tanpa DOM). Dipakai UI dan skrip pengujian. */
(function(root){

function pick(a){return a[rnd(a.length)]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1);var t=a[i];a[i]=a[j];a[j]=t}return a}

function r1(x){return Math.round(x*10)/10}

K.store={
  get:function(k){try{return root.localStorage.getItem(k)}catch(e){return null}},
  set:function(k,v){try{root.localStorage.setItem(k,v);return true}catch(e){return false}},
  del:function(k){try{root.localStorage.removeItem(k)}catch(e){}}
};
function defaults(){
  return {v:1,demo:false,gold:0,ink:0,shards:0,potions:2,
    owned:{weapons:['quill'],hair:['short','long','ponytail'],outfits:['tunic'],hat:['none'],face:['none'],neck:['none'],back:['none']},
    cfg:{body:'medium',height:0.5,skin:1,hairStyle:'short',hairColor:0,eye:0,outfit:'tunic',dye:0,hat:'none',face:'none',neck:'none',back:'none'},
    weapon:'quill',wup:{},wuses:{},cleared:{},seen:{},codex:{},perf:{ok:0,bad:0,off:0},
    settings:{lang:'auto',sound:true,music:true,vMaster:80,vMusic:70,vSfx:80,theme:'auto',reduce:false,haptics:true},ending:null,ads:{day:'',n:0},iap:{tokens:[]},login:{last:0,n:0},profile:{name:'',avatar:'me'},lastRift:'',stats:{fights:0,answers:0,right:0}};
}
function merge(base,src){
  if(!src||typeof src!=='object') return base;
  for(var k in base){
    if(!Object.prototype.hasOwnProperty.call(src,k)) continue;
    var b=base[k],s=src[k];
    if(b&&typeof b==='object'&&!Array.isArray(b)&&Object.keys(b).length&&k!=='codex'&&k!=='cleared'&&k!=='wup'&&k!=='wuses'&&k!=='seen') base[k]=merge(b,s);
    else if(s!==undefined&&s!==null) base[k]=s;
  }
  return base;
}

K.stageKey=function(ch,stage){return (ch+1)+'-'+stage};

/* ---------- Pembelian shard ---------- */
/* Dipanggil jembatan Play Billing setelah pembelian sukses. true = sudah dikreditkan (aman untuk di-consume). Idempoten per token. */
K.grantPurchase=function(id,token){
  var pack=null,i;for(i=0;i<WB.IAP_PACKS.length;i++) if(WB.IAP_PACKS[i].id===id) pack=WB.IAP_PACKS[i];
  if(!pack||!token) return false;

  if(demo){ /* uang asli selalu masuk ke akun asli, bukan akun demo */
    var raw=K.store.get(KEY_MAIN),src=null;

  obj.shards+=pack.shards;list.push(String(token));if(list.length>60) list.shift();obj.iap={tokens:list};

  return !!ok;
};
